<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI-world</title>
<meta http-equiv="Cache-Control" content="no-store"/>
<style>
:root {
  --bg:#0b1016; --bg-elevated:#121821; --bg-subtle:#18202b;
  --fg:#e7eef6; --fg-muted:#8b9aab; --fg-subtle:#5d6b7a;
  --border: color-mix(in oklab, var(--fg) 10%, transparent);
  --accent:#c9d4e0; --accent-fg:#0b1016; --ok:#6fbf8a; --danger:#c45b55;
  --you:#d8d2c6; --them:#c47a62;
  --font-display:"Iowan Old Style", Palatino, Georgia, serif;
  --font-body:"Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);min-height:100%}
button,[role=button]{cursor:pointer} button:disabled{cursor:default;opacity:.4}
.shell{width:min(1320px,calc(100% - 24px));margin:0 auto;padding:16px 0 28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:600;letter-spacing:-.03em;font-size:1.55rem;margin:0}
.sub{color:var(--fg-muted);font-size:.85rem;margin-top:2px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.kicker{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-subtle);font-weight:600}
input[type=number]{height:34px;width:80px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:0 8px;font:inherit;margin-left:6px}
.btn{height:38px;border:0;border-radius:8px;padding:0 14px;font:600 .88rem var(--font-body)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border)}
.btn.on{border-color:var(--ok);color:var(--ok)}
.world-box{border:1px solid var(--border);border-radius:10px;padding:6px 10px;background:var(--bg-elevated);min-width:140px}
.world-box summary{cursor:pointer;list-style:none;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);font-weight:700}
.world-box summary::-webkit-details-marker{display:none}
.world-box[open]{position:relative;z-index:2}
.world-box .drawer{display:flex;gap:10px;padding-top:8px;flex-wrap:wrap}
.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.stat span{display:block;color:var(--fg-subtle);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
.stat b{font-family:var(--font-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;color:var(--ok);font-size:.72rem;margin-left:4px}
.stat em.down{color:var(--danger)}
.stat.west{box-shadow:inset 3px 0 0 var(--you)}
.stat.east{box-shadow:inset 3px 0 0 var(--them)}
.ages-block{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ages-row{display:flex;align-items:center;gap:8px}
.ages-row .who{flex:0 0 44px;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.ages-row.west .who{color:var(--you)}
.ages-row.east .who{color:var(--them)}
.ages{display:flex;flex:1;overflow-x:auto;background:var(--bg-elevated);border:1px solid var(--border);border-radius:99px;padding:4px}
.age{flex:1;text-align:center;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);padding:5px 6px;white-space:nowrap;border-radius:99px}
.age.on{color:var(--fg);background:var(--bg-subtle)}
.age.now.west{color:#1a1814;background:var(--you);font-weight:700}
.age.now.east{color:#1c100e;background:var(--them);font-weight:700}
.race{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.lane{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.lane .pair{display:flex;justify-content:space-between;gap:8px;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:6px}
.lane .pair b{color:var(--fg);font-weight:600;letter-spacing:0;text-transform:none;font-size:.78rem}
.dual{display:flex;height:7px;border-radius:99px;overflow:hidden;background:#080c11;gap:2px}
.dual i{display:block;height:100%}
.dual i.w{background:var(--you)}
.dual i.e{background:var(--them)}
.stage{display:grid;grid-template-columns:240px 1fr 280px;gap:12px}
.panel{background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:0}
.kicker{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-subtle);font-weight:600;margin-bottom:8px}
.log{max-height:min(72vh,640px);overflow:auto;font-size:.82rem;line-height:1.4;color:var(--fg-muted)}
.log .ev{border-top:1px solid var(--border);padding:8px 0}
.log .ev b{display:block;color:var(--fg-subtle);font-size:.68rem;font-weight:600;letter-spacing:.06em}
.map-wrap{overflow:auto;background:#071018;border-radius:10px;padding:8px}
#map{display:grid;gap:0;width:max-content;margin:0 auto}
.cell{width:18px;height:18px;background:#2a4a28;display:flex;align-items:center;justify-content:center;font:8px/1 var(--font-mono);color:color-mix(in oklab,var(--fg) 62%,transparent);user-select:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.cell.water{background:#1a4a62}
.cell.shore{background:#3d6a52}
.cell.grass-d{background:#234a28}
.cell.grass{background:#2f5a30}
.cell.meadow{background:#3d6a34}
.cell.wood{background:#1e3a24}
.cell.tree{background:#16301c}
.cell.rock{background:#3a423c}
.cell.yard.west{background:#5a4e3a}
.cell.yard.east{background:#5a3e36}
.cell.plaza.west{background:#8a7860}
.cell.plaza.east{background:#8a5a4c}
.cell.field.west{background:#4a7a38}
.cell.field.east{background:#6a6a34}
.cell.crop-a{background:#5a8a3c}
.cell.crop-b{background:#3d6a30}
.cell.path{background:#5a4a34}
.cell.agent{background:var(--you);border-radius:50%;color:transparent;box-shadow:none}
.cell.rival-agent{background:var(--them);border-radius:50%;color:transparent;box-shadow:none}
.cell.settlement{background:#d4c4a4;color:#2a2418;font-weight:700}
.cell.farm{background:#4d7a40}
.cell.storage{background:#5c4638}
.cell.hut{background:#8a6844}
.cell.hut.west{background:#c49a62}
.cell.hut.east{background:#b07050}
.cell.granary{background:#6a5430}
.cell.mine{background:#4a4a4a}
.cell.road{background:#3a342c}
.cell.workshop{background:#5e4232}
.cell.workshop.west{background:#6e5238}
.cell.workshop.east{background:#6e4234}
.cell.barracks{background:#6e3c36}
.cell.market{background:#4a4e3c}
.cell.temple{background:#3e4250}
.cell.academy{background:#3d5a68}
.cell.walls{background:#3a3a42}
.cell.irrigation{background:#345048}
.cell.library{background:#4a7088}
.cell.foundry{background:#704840}
.cell.hall{background:#5a5850}
.cell.command{background:#4a302e}
.cell.lab{background:#3a6080}
.cell.observatory{background:#2a4060}
.cell.rival{box-shadow:inset 0 0 0 1px #a85a48}
#map.age-town .cell,#map.age-city .cell,#map.age-science .cell{width:20px;height:20px;font-size:9px}
#map.age-town .cell.grass,#map.age-town .cell.grass-d,#map.age-town .cell.meadow{filter:saturate(1.15)}
#map.age-city .cell.yard.west{background:#4a4e58}
#map.age-city .cell.yard.east{background:#5a4044}
#map.age-city .cell.grass{background:#2a4a38}
#map.age-science .cell.library,#map.age-science .cell.lab,#map.age-science .cell.observatory{box-shadow:0 0 7px color-mix(in oklab,#6ab0d0 40%,transparent)}
#map.age-science .cell.water{background:#163848}
.city h2{font-family:var(--font-display);font-size:1.15rem;margin:0 0 4px}
.city .lead{color:var(--fg-muted);margin:0 0 8px;font-size:.88rem}
.city .folk{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.city .folk:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.bar{height:4px;background:#080c11;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0}
.bar.low>i{background:var(--danger)}
.bar.east>i{background:var(--them)}
.bar.west>i{background:var(--you)}
.meter{margin:8px 0}
.meter label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--fg-muted)}
.meter .bar{margin:4px 0 0}
.chip{display:inline-block;font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);border:1px solid var(--border);border-radius:99px;padding:2px 7px;margin:3px 4px 0 0}
.legend{color:var(--fg-subtle);font-size:.7rem;line-height:1.45;margin-top:8px}
.banner{padding:8px 10px;border-radius:8px;background:var(--bg-subtle);margin-bottom:10px;font-size:.85rem}
.banner.win{border:1px solid color-mix(in oklab,var(--ok) 50%,transparent);font-weight:600}
.banner.lose{border:1px solid color-mix(in oklab,var(--danger) 50%,transparent);font-weight:600}
.epilogue{display:none;margin-bottom:10px;padding:14px 14px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg-subtle)}
.epilogue.show{display:block}
.epilogue.live{border-color:color-mix(in oklab,var(--ok) 35%,transparent)}
.epilogue.live .score{display:none}
.epilogue .eyebrow{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-subtle);margin:0 0 4px}
.epilogue h3{font-family:var(--font-display);font-size:1.4rem;margin:0 0 4px;font-weight:600}
.epilogue .why{color:var(--fg-muted);margin:0 0 12px;font-size:.9rem}
.epilogue .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.epilogue .side{border-radius:8px;padding:8px 10px;background:var(--bg-elevated);border:1px solid var(--border)}
.epilogue .side.held{border-color:color-mix(in oklab,var(--ok) 45%,transparent)}
.epilogue .side .k{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-subtle)}
.epilogue .side h4{font-family:var(--font-display);margin:2px 0 6px;font-size:1.05rem}
.epilogue .side p{margin:0;font-size:.8rem;color:var(--fg-muted);line-height:1.45}
.epilogue .score{margin-top:10px;font-family:var(--font-mono);font-size:.8rem;color:var(--fg-subtle)}
@media(max-width:980px){
  .stage{grid-template-columns:1fr}
  .hud{grid-template-columns:repeat(3,1fr)}
  .race{grid-template-columns:1fr}
  .log{max-height:220px}
  .epilogue .sides{grid-template-columns:1fr}
}
</style></head>
<body>
<script>
(function(){try{if(window.parent===window)return;var ref=document.referrer||"",origin=null;
if(ref)origin=new URL(ref).origin;
if(!origin&&location.ancestorOrigins&&location.ancestorOrigins.length)origin=location.ancestorOrigins[0];
if(!origin)return;
var msg=function(type,extra){var o={channel:"grok-preview-bridge",version:1,type:type};if(extra)for(var k in extra)o[k]=extra[k];window.parent.postMessage(o,origin);};
msg("location",{path:location.pathname||"/",search:location.search,hash:location.hash});msg("ready");
window.addEventListener("message",function(ev){if(ev.source!==window.parent)return;if(!ev.data||ev.data.channel!=="grok-preview-bridge")return;
if(ev.data.type==="hello"){msg("location",{path:location.pathname||"/",search:location.search,hash:location.hash});msg("ready");}});}catch(e){}})();
</script>
<div class="shell">
  <div class="topbar">
    <div><h1>AI-world</h1><div class="sub">Watch the ages. Two peoples. Same map. · v10</div></div>
    <div class="controls">
      <details class="world-box" id="worldBox">
        <summary id="worldSum">World</summary>
        <div class="drawer">
          <label class="kicker">Seed <input id="seed" type="number" value="42" min="1"/></label>
          <label class="kicker">Clock <input id="ticks" type="number" value="8000" min="400" step="100"/></label>
        </div>
      </details>
      <button class="btn primary" id="begin">Watch</button>
      <button class="btn ghost" id="pauseBtn" disabled>Pause</button>
      <button class="btn ghost" data-speed="1">1×</button>
      <button class="btn ghost on" data-speed="2">2×</button>
      <button class="btn ghost" data-speed="4">4×</button>
      <button class="btn ghost" data-speed="0">Max</button>
    </div>
  </div>
  <div class="hud" id="hud"></div>
  <div class="ages-block" id="ages"></div>
  <div class="race" id="race"></div>
  <div class="stage">
    <div class="panel"><div class="kicker">Event log</div><div class="log" id="log"></div></div>
    <div class="panel">
      <div id="statusBanner" class="banner">Open a world and watch. · v10</div>
      <div id="epilogue" class="epilogue"></div>
      <div class="map-wrap"><div id="map"></div></div>
      <div class="legend">River and lakes · forest in clumps · pale yards west · clay yards east · farm rows · L library · R lab · V observatory</div>
    </div>
    <div class="panel city" id="city"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let timer=null,lastRaidTick=-1,lastTick=-1,lastOutcomeTick=-1,prevWorld=null,prevSample=null,paused=false,speed=2,lastSides=null;
const GLYPH={library:"L",lab:"R",observatory:"V",barracks:"B",academy:"C",walls:"#",temple:"T"};
const AGES=[["camp","Camp"],["era2","Settlement"],["era3","Town"],["era4","City"],["library","Library"],["lab","Lab"],["observatory","Observatory"]];
const ERA_WORD={0:"camp",1:"camp",2:"settlement",3:"town",4:"city"};
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    if(c==="&") return "&"+"amp;";
    if(c==="<") return "&"+"lt;";
    if(c===">") return "&"+"gt;";
    if(c==='"') return "&"+"#34;";
    return "&"+"#39;";
  });
}
function yearOf(tick){return tick==null?"—":"Year "+tick;}
function syncWorldSum(){
  const n=Number($("seed").value)||42;
  $("worldSum").textContent="World "+n;
}
function logLine(tick,t){
  t=String(t||"").trim();
  if(!t) return;
  const d=document.createElement("div");d.className="ev";
  if(tick!=null){const b=document.createElement("b");b.textContent=yearOf(tick);d.appendChild(b);}
  d.appendChild(document.createTextNode(t));
  $("log").prepend(d);
}
function splitTowns(world){const towns=(world&&world.settlements)||[];return{you:towns.filter(s=>(s.faction||"player")==="player"),them:towns.filter(s=>s.faction==="rival")};}
function foodDays(s){const need=Number(s.population||0)*0.22+Number(s.soldiers||0)*0.03;if(need<=0)return null;return Number(s.food_stock||0)/need;}
function capital(towns){if(!towns.length)return null;return towns.slice().sort((a,b)=>Number(b.population||0)-Number(a.population||0))[0];}
function ownStructs(world,fac){return ((world&&world.structures)||[]).filter(s=>factionOf(world,s)===fac);}
function sum(list,k){return list.reduce((a,s)=>a+Number(s[k]||0),0);}
function factionOf(world,st){
  if(st&&st.faction) return st.faction;
  const towns=(world&&world.settlements)||[];
  let best=null,bd=1e9;
  for(const t of towns){
    if(st.x==null||t.x==null) continue;
    const d=Math.abs(Number(t.x)-Number(st.x))+Math.abs(Number(t.y)-Number(st.y));
    if(d<bd){bd=d;best=t;}
  }
  return (best&&best.faction)||"player";
}
function facName(f){return f==="rival"?"east":"west";}
function sciBits(world,fac){
  const st=ownStructs(world,fac);
  const has=t=>st.some(s=>s.type===t);
  const towns=fac==="player"?splitTowns(world).you:splitTowns(world).them;
  const disc=sum(towns,"discoveries");
  return {lib:has("library"),lab:has("lab"),obs:has("observatory"),disc,steps:(has("library")?1:0)+(has("lab")?1:0)+(has("observatory")?1:0)+disc};
}
function ageState(world,fac){
  const towns=fac==="player"?splitTowns(world).you:splitTowns(world).them;
  const sci=sciBits(world,fac);
  const era=towns.reduce((a,s)=>Math.max(a,Number(s.era||2)),0);
  const on={camp:true,era2:towns.length>0,era3:era>=3,era4:era>=4,library:sci.lib,lab:sci.lab,observatory:sci.obs};
  let now="camp";for(const [id] of AGES) if(on[id]) now=id;
  return {on,now,era,sci,people:sum(towns,"population"),soldiers:sum(towns,"soldiers"),cap:capital(towns)};
}
function sidesOf(world){return {west:ageState(world||{},"player"),east:ageState(world||{},"rival")};}
function orderOf(id){return AGES.findIndex(([k])=>k===id);}
function fmtRate(cur,key){if(!prevSample)return "";const dt=Number(cur.tick||0)-Number(prevSample.tick||0);if(dt<=0)return "";const r=(Number(cur[key]||0)-Number(prevSample[key]||0))/dt*100;if(!isFinite(r)||Math.abs(r)<0.05)return "";return `${r>=0?"+":""}${r.toFixed(1)}`;}
function renderAges(world){
  const {west,east}=sidesOf(world);
  const row=(side,cls,label)=>`<div class="ages-row ${cls}"><div class="who">${label}</div><div class="ages">${AGES.map(([id,name])=>`<div class="age ${id===side.now?"now "+cls:(side.on[id]?"on":"")}">${name}</div>`).join("")}</div></div>`;
  $("ages").innerHTML=row(west,"west","West")+row(east,"east","East");
  const map=$("map");
  map.classList.remove("age-camp","age-settlement","age-town","age-city","age-science");
  const lead=orderOf(west.now)>=orderOf(east.now)?west:east;
  if(lead.on.library||lead.on.lab||lead.on.observatory) map.classList.add("age-science");
  else if(lead.on.era4) map.classList.add("age-city");
  else if(lead.on.era3) map.classList.add("age-town");
  else if(lead.on.era2) map.classList.add("age-settlement");
  else map.classList.add("age-camp");
}
function sampleOf(world){
  const {west,east}=sidesOf(world);
  const tot=(world&&world.totals)||{};
  return {tick:world&&world.tick,wp:west.people,ep:east.people,ws:west.soldiers,es:east.soldiers,food:tot.food,wood:tot.wood,stone:tot.stone};
}
function renderHud(world){
  const s=sampleOf(world||{});
  const cell=(k,v,r,cls)=>`<div class="stat ${cls||""}"><span>${k}</span><b>${v??"—"}${r?`<em class="${String(r).startsWith("-")?"down":""}">${r}/100t</em>`:""}</b></div>`;
  $("hud").innerHTML=[
    cell("West people",s.wp,fmtRate(s,"wp"),"west"),
    cell("East people",s.ep,fmtRate(s,"ep"),"east"),
    cell("West soldiers",Number(s.ws||0).toFixed(1),"","west"),
    cell("East soldiers",Number(s.es||0).toFixed(1),"","east"),
    cell("Land food",s.food??"—",fmtRate(s,"food"),""),
    cell("Year",s.tick??"—","","")
  ].join("");
}
function renderRace(world){
  const {west,east}=sidesOf(world);
  const lane=(title,wv,ev,wmax,emax)=>{
    const wt=Math.max(wmax,emax,1), wp=Math.max(0,wv)/wt*100, ep=Math.max(0,ev)/wt*100;
    return `<div class="lane"><div class="pair"><span>${title}</span><b>${esc(wv)} · ${esc(ev)}</b></div><div class="dual"><i class="w" style="width:${wp.toFixed(1)}%"></i><i class="e" style="width:${ep.toFixed(1)}%"></i></div></div>`;
  };
  $("race").innerHTML=
    lane("Science path",(west.sci.steps>5?5+"+":west.sci.steps)+"/5",(east.sci.steps>5?5+"+":east.sci.steps)+"/5",5,5)+
    lane("People",west.people,east.people,west.people,east.people)+
    lane("Soldiers",west.soldiers.toFixed(1),east.soldiers.toFixed(1),west.soldiers,east.soldiers);
}
function folkBlock(side,title,barCls){
  const cap=side.cap;
  const days=cap?foodDays(cap):null;
  const fill=days==null?0:Math.max(0,Math.min(100,(days/20)*100));
  const low=days!=null&&days<3;
  const eraWord=ERA_WORD[side.era]||"camp";
  let lead="Still walking.";
  if(cap&&days!=null&&days<1) lead=`${side.people} souls. Granary empty — food is short.`;
  else if(cap&&days!=null&&days<3) lead=`${side.people} souls. Only ${Math.floor(days)} days of food.`;
  else if(cap) lead=`${side.people} souls. A ${eraWord}.`;
  const disc=side.sci.disc;
  const discWord=disc===1?"1 discovery":(disc?disc+" discoveries":"no discoveries");
  const sci=`${discWord}${side.sci.obs?" · observatory":(side.sci.lab?" · lab":(side.sci.lib?" · library":""))}`;
  const chips=((cap&&cap.subjects)||[]).map(sub=>`<span class="chip">${esc(sub)}</span>`).join("");
  return `<div class="folk"><div class="kicker">${title}</div>
    <h2>${cap?esc(cap.id)+" · "+eraWord:"No town yet"}</h2>
    <p class="lead">${esc(lead)}</p>
    <div class="meter"><label><span>Food days</span><span>${days==null?"—":(days<1?"short":Math.floor(days)+"d")}</span></label><div class="bar ${low?"low":""} ${barCls}"><i style="width:${fill.toFixed(0)}%"></i></div></div>
    <div class="meter"><label><span>Science</span><span>${esc(sci)}</span></label><div class="bar ${barCls}"><i style="width:${Math.min(100,side.sci.steps/5*100)}%"></i></div></div>
    <div class="meter"><label><span>Military</span><span>${side.soldiers.toFixed(1)}</span></label><div class="bar ${barCls}"><i style="width:${Math.min(100,side.soldiers*8)}%"></i></div></div>
    ${chips}</div>`;
}
function renderCity(world){
  const {west,east}=sidesOf(world);
  lastSides={west,east};
  $("city").innerHTML=folkBlock(west,"The west","west")+folkBlock(east,"The east","east");
}
function hash(x,y){return Math.abs((x*19+y*37+(x*y*7))%256);}
function n01(x,y){return hash(x,y)/255;}
function elev(x,y){return n01(x,y)*0.5 + n01(x>>1,y>>1)*0.32 + n01((x+5)>>2,(y+3)>>2)*0.18;}
function strokePath(set,x0,y0,x1,y1){
  let x=x0,y=y0;
  while(x!==x1||y!==y1){
    if(x!==x1) x+=x1>x?1:-1;
    else if(y!==y1) y+=y1>y?1:-1;
    set(x,y,"path","", "path", 2);
  }
}
function paintLand(w,h,set){
  const kind=Array.from({length:h},()=>Array(w).fill("grass"));
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const e=elev(x,y);
    const lake=n01(x>>2,y>>2);
    const grove=n01((x+5)>>2,(y+2)>>2);
    const patch=n01((x+2)>>2,(y+7)>>2);
    let k="grass";
    if(e<0.28) k="water";
    else if(e<0.34) k="shore";
    else if(e<0.44) k="grass-d";
    else if(e<0.60) k="grass";
    else if(e<0.76) k="meadow";
    else k="rock";
    if(lake>0.78 && e>0.26 && e<0.58) k="water";
    if(k!=="water" && grove>0.64 && e>0.36 && e<0.74) k=(n01(x,y+3)>0.42)?"tree":"wood";
    if((k==="grass"||k==="grass-d") && patch>0.52 && patch<0.68 && e>0.40) k="meadow";
    kind[y][x]=k;
  }
  let ry=6+(hash(2,9)%10);
  for(let x=0;x<w;x++){
    kind[ry][x]="water";
    if(ry>2) kind[ry-1][x]=(kind[ry-1][x]==="water")?"water":"shore";
    if(ry<h-3) kind[ry+1][x]=(kind[ry+1][x]==="water")?"water":"shore";
    const step=hash(x,ry)%4;
    if(step===0 && ry>3) ry--;
    else if(step===1 && ry<h-4) ry++;
  }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(kind[y][x]!=="water"){
      let adj=0;
      if(x&&kind[y][x-1]==="water") adj++;
      if(x<w-1&&kind[y][x+1]==="water") adj++;
      if(y&&kind[y-1][x]==="water") adj++;
      if(y<h-1&&kind[y+1][x]==="water") adj++;
      if(adj>=1 && (kind[y][x]==="grass"||kind[y][x]==="grass-d"||kind[y][x]==="meadow")) kind[y][x]="shore";
    }
    set(x,y,kind[y][x],"","",0);
  }
}
function renderMap(world){
  if(!world) return;
  const w=world.width||32,h=world.height||32,map=$("map");
  const size=(map.classList.contains("age-town")||map.classList.contains("age-city")||map.classList.contains("age-science"))?20:18;
  map.style.gridTemplateColumns=`repeat(${w}, ${size}px)`;
  const occ={};
  function set(x,y,cls,mark,title,z){
    if(x<0||y<0||x>=w||y>=h) return;
    const k=x+","+y;
    if(!occ[k]||occ[k].z<=z) occ[k]={cls,mark:mark||"",title:title||"",z};
  }
  paintLand(w,h,set);
  for(const town of world.settlements||[]){
    const era=Number(town.era||2);
    const pop=Number(town.population||0);
    const r=Math.min(6, 2+(era>=4?2:era>=3?1:0)+Math.floor(pop/28));
    const fn=facName(town.faction);
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.abs(dx)+Math.abs(dy)<=r) set(town.x+dx,town.y+dy,"yard "+fn,"",town.id+" district",1);
    }
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      set(town.x+dx,town.y+dy,"plaza "+fn,"",town.id+" square",4);
    }
  }
  for(const st of world.structures||[]){
    const fn=facName(factionOf(world,st));
    if(st.type==="farm"||st.type==="irrigation"){
      const R=st.type==="irrigation"?2:1;
      for(let dy=-R;dy<=R;dy++) for(let dx=-R;dx<=R;dx++){
        const crop=(st.y+dy)%2===0?"crop-a":"crop-b";
        set(st.x+dx,st.y+dy,crop+" field "+fn,"","fields",3);
      }
    }
    if(st.type==="hut"||st.type==="workshop"||st.type==="storage"||st.type==="granary"){
      set(st.x+1,st.y,"yard "+fn,"","yards",3);
      set(st.x,st.y+1,"yard "+fn,"","yards",3);
    }
  }
  const towns=world.settlements||[];
  for(const st of world.structures||[]){
    let best=null,bd=1e9;
    for(const t of towns){
      const d=Math.abs(t.x-st.x)+Math.abs(t.y-st.y);
      if(d<bd){bd=d;best=t;}
    }
    if(best&&bd>1&&bd<10) strokePath(set,best.x,best.y,st.x,st.y);
  }
  for(const st of world.structures||[]){
    const fac=factionOf(world,st);
    const fn=facName(fac);
    const mark=GLYPH[st.type]||"";
    const skin=(st.type||"")+" "+fn+(fac==="rival"?" rival":"");
    set(st.x,st.y,skin,mark,(fn+" "+(st.type||"")),6);
  }
  for(const town of towns){
    set(town.x,town.y,(town.faction==="rival"?"settlement rival":"settlement"),"",town.id,7);
  }
  for(const a of world.agents||[]){
    set(a.x,a.y,a.faction==="rival"?"rival-agent":"agent","",a.faction==="rival"?"east walker":"west walker",9);
  }
  let html="";
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const c=occ[x+","+y]||{cls:"grass",mark:"",title:""};
    html+=`<div class="cell ${c.cls}"${c.title?` title="${esc(c.title)}"`:""}>${c.mark||""}</div>`;
  }
  map.innerHTML=html;
}
function chronicleDiff(world){
  if(!prevWorld){prevWorld=world;return;}
  const tick=world.tick, oldBy={};
  for(const s of prevWorld.settlements||[]) oldBy[s.id]=s;
  for(const s of world.settlements||[]){
    const o=oldBy[s.id];
    const who=(s.faction==="rival"?"East":"West");
    if(!o){logLine(tick,`${who} founded ${s.id}.`);continue;}
    if(Number(s.era||2)>Number(o.era||2)) logLine(tick,`${who} ${s.id} became a ${ERA_WORD[s.era]||("era "+s.era)}.`);
    const had=new Set(o.subjects||[]);
    for(const sub of (s.subjects||[])) if(sub&&!had.has(sub)) logLine(tick,`${who} ${s.id} unlocked ${sub}.`);
    if(Number(s.discoveries||0)>Number(o.discoveries||0)) logLine(tick,`${who} ${s.id} made a discovery (${s.discoveries}).`);
    if(Number(s.population||0)+2<Number(o.population||0)) logLine(tick,`${who} ${s.id} lost people.`);
  }
  const risen={library:"A library rose",lab:"A lab rose",observatory:"An observatory rose",barracks:"Barracks rose",academy:"An academy rose",farm:"Fields spread"};
  for(const [typ,line] of Object.entries(risen)){
    const n=(wld,fac)=>ownStructs(wld,fac).filter(s=>s.type===typ).length;
    if(n(world,"player")>n(prevWorld,"player")) logLine(tick,`${line} in the west.`);
    if(n(world,"rival")>n(prevWorld,"rival")) logLine(tick,`${line} in the east.`);
  }
  prevWorld=world;
}
function raceLine(world){
  if(!world) return "";
  const {west,east}=sidesOf(world);
  if(!west.cap && !east.cap) return "Both still walking.";
  if(east.sci.steps>west.sci.steps) return `East leads the science path (${east.sci.steps} vs ${west.sci.steps}).`;
  if(west.sci.steps>east.sci.steps) return `West leads the science path (${west.sci.steps} vs ${east.sci.steps}).`;
  if(orderOf(east.now)>orderOf(west.now)) return `East leads the ages — ${AGES.find(a=>a[0]===east.now)[1]} vs ${AGES.find(a=>a[0]===west.now)[1]}.`;
  if(orderOf(west.now)>orderOf(east.now)) return `West leads the ages — ${AGES.find(a=>a[0]===west.now)[1]} vs ${AGES.find(a=>a[0]===east.now)[1]}.`;
  if(west.people>east.people) return `Even on the path. West has more people (${west.people} vs ${east.people}).`;
  if(east.people>west.people) return `Even on the path. East has more people (${east.people} vs ${west.people}).`;
  return `Even — ${AGES.find(a=>a[0]===west.now)[1]} · ${west.people} each side.`;
}
function holdTitle(winner){
  if(winner==="player") return "The west holds";
  if(winner==="rival") return "The east holds";
  return "Even";
}
function renderEpilogue(state){
  const box=$("epilogue");
  const o=state.outcome;
  if(!o||!o.winner){box.className="epilogue";box.innerHTML="";return;}
  const {west,east}=lastSides||sidesOf(state.world||{});
  const live=state.status==="running"||state.status==="paused";
  const sideHtml=(side,name,held)=>`<div class="side${held?" held":""}"><div class="k">${name}${held?" · holds":""}</div>
    <h4>${side.cap?esc(side.cap.id):"No town"} · ${esc(ERA_WORD[side.era]||"camp")}</h4>
    <p>${side.people} souls · science ${side.sci.steps}/5 · army ${side.soldiers.toFixed(1)}</p></div>`;
  box.className="epilogue show"+(live?" live":"");
  box.innerHTML=`<p class="eyebrow">${live?"They hold · the ages continue":"Chapter closed"} · ${esc(o.kind||"outcome")}</p>
    <h3>${esc(holdTitle(o.winner))}</h3>
    <p class="why">${esc(o.reason||"")}${live?" The land keeps growing.":""}</p>
    <div class="sides">${sideHtml(west,"West",o.winner==="player")}${sideHtml(east,"East",o.winner==="rival")}</div>
    <div class="score">Score ${esc(state.score??"—")} · ${esc(yearOf(o.tick??lastTick))}</div>`;
}
function renderBanner(state){
  const banner=$("statusBanner");
  const o=state.outcome||{};
  if(state.status==="done"){
    const w=o.winner||"";
    banner.className="banner "+(w==="player"?"win":(w==="rival"?"lose":""));
    banner.textContent=w?`${holdTitle(w)} · ${o.kind||"outcome"}. Clock ended.`:(`Finished · Score ${state.score??"—"}.`);
  } else if(state.status==="error"){banner.className="banner lose";banner.textContent="Could not run. Hit Watch again.";$("begin").disabled=false;}
  else if(o.winner){banner.className="banner "+(o.winner==="player"?"win":(o.winner==="rival"?"lose":""));banner.textContent=`${holdTitle(o.winner)} · ${o.kind||"outcome"}. The ages continue.`;}
  else if(state.paused){banner.className="banner";banner.textContent="Paused. "+raceLine(state.world);}
  else if(state.status==="running"){banner.className="banner";banner.textContent=raceLine(state.world)||"The ages are turning.";}
  else {banner.className="banner";banner.textContent="Open a world and watch. · v10";}
  renderEpilogue(state);
}
async function poll(){
  const state=await (await fetch("/api/state")).json();
  paused=!!state.paused; $("pauseBtn").textContent=paused?"Resume":"Pause";
  const world=state.world;
  if(world&&world.outcome&&!state.outcome) state.outcome=world.outcome;
  if(world&&world.tick!==lastTick){
    lastTick=world.tick; renderAges(world); renderHud(world); renderRace(world); renderMap(world); renderCity(world); chronicleDiff(world); prevSample=sampleOf(world);
    const raid=(world.metrics||{}).last_raid;
    if(raid&&raid.tick!==lastRaidTick){lastRaidTick=raid.tick;logLine(world.tick,`${raid.attacker_faction==="player"?"West raided":"East raided"} ${raid.target}.`);}
  }
  renderBanner(state);
  if(state.outcome&&state.outcome.winner&&lastOutcomeTick<0){
    lastOutcomeTick=state.outcome.tick!=null?state.outcome.tick:(lastTick>=0?lastTick:0);
    const o=state.outcome;
    const {west,east}=lastSides||sidesOf(world||{});
    logLine(lastOutcomeTick,`${holdTitle(o.winner)} — ${o.kind||"outcome"}: ${o.reason||""} The ages continue.`);
    logLine(lastOutcomeTick,`West ${west.people} souls · ${ERA_WORD[west.era]||"camp"} · science ${west.sci.steps}/5. East ${east.people} souls · ${ERA_WORD[east.era]||"camp"} · science ${east.sci.steps}/5.`);
  }
  if(state.status==="done"){
    if(world){renderAges(world);renderHud(world);renderRace(world);renderMap(world);renderCity(world);}
    logLine(lastTick>=0?lastTick:null,`Clock ended. Score ${state.score??"—"}`);
    clearInterval(timer);timer=null;$("begin").disabled=false;$("pauseBtn").disabled=true;
  }
}
async function begin(){
  $("begin").disabled=true;$("pauseBtn").disabled=false;$("pauseBtn").textContent="Pause";
  $("log").innerHTML="";lastTick=-1;lastRaidTick=-1;lastOutcomeTick=-1;prevWorld=null;prevSample=null;paused=false;lastSides=null;
  $("epilogue").className="epilogue";$("epilogue").innerHTML="";
  const seed=Number($("seed").value)||42, ticks=Number($("ticks").value)||8000;
  syncWorldSum();
  logLine(null,`A world opens. The clock runs ${ticks} years.`);
  try{const res=await fetch("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({seed,ticks,speed})}); if(!res.ok) throw new Error("start");}
  catch(e){logLine(null,"Could not start. Hit Watch again.");$("begin").disabled=false;return;}
  if(timer) clearInterval(timer); timer=setInterval(poll,280); poll();
}
async function setControl(payload){await fetch("/api/control",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});}
$("begin").onclick=begin;
$("pauseBtn").onclick=()=>setControl({paused:!paused});
$("seed").addEventListener("input",syncWorldSum);
document.querySelectorAll("[data-speed]").forEach(btn=>{btn.onclick=()=>{speed=Number(btn.dataset.speed);document.querySelectorAll("[data-speed]").forEach(b=>b.classList.toggle("on",b===btn));setControl({speed});};});
syncWorldSum();
renderAges({});renderHud({});renderRace({});renderCity({});
renderMap({width:32,height:32,settlements:[],structures:[],agents:[]});
(async()=>{
  try{
    const state=await (await fetch("/api/state")).json();
    if(state.status==="running"||state.status==="paused"||state.status==="done"){
      $("begin").disabled=state.status!=="done";
      $("pauseBtn").disabled=state.status==="done";
      if(state.status!=="done"){if(timer)clearInterval(timer);timer=setInterval(poll,280);}
      poll();
    }
  }catch(e){}
})();
</script></body></html>
