<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI-world</title>
<meta http-equiv="Cache-Control" content="no-store"/>
<style>
:root {
  --bg:#0b1016; --bg-elevated:#121821; --bg-subtle:#18202b;
  --fg:#e7eef6; --fg-muted:#8b9aab; --fg-subtle:#5d6b7a;
  --border: color-mix(in oklab, var(--fg) 10%, transparent);
  --accent:#c9d4e0; --accent-fg:#0b1016; --ok:#6fbf8a; --danger:#c45b55;
  --you:#d8d2c6; --them:#c47a62; --north:#7aa0c0; --south:#7a9a62;
  --font-display:"Iowan Old Style", Palatino, Georgia, serif;
  --font-body:"Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);min-height:100%}
button,[role=button]{cursor:pointer} button:disabled{cursor:default;opacity:.4}
.shell{width:min(1320px,calc(100% - 24px));margin:0 auto;padding:16px 0 28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:600;letter-spacing:-.03em;font-size:1.55rem;margin:0}
.sub{color:var(--fg-muted);font-size:.85rem;margin-top:2px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.kicker{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-subtle);font-weight:600}
input[type=number]{height:34px;width:80px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:0 8px;font:inherit;margin-left:6px}
.btn{height:38px;border:0;border-radius:8px;padding:0 14px;font:600 .88rem var(--font-body)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border)}
.btn.on{border-color:var(--ok);color:var(--ok)}
.world-box{border:1px solid var(--border);border-radius:10px;padding:6px 10px;background:var(--bg-elevated);min-width:140px}
.world-box summary{cursor:pointer;list-style:none;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);font-weight:700}
.world-box summary::-webkit-details-marker{display:none}
.world-box[open]{position:relative;z-index:2}
.world-box .drawer{display:flex;gap:10px;padding-top:8px;flex-wrap:wrap}
.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.stat span{display:block;color:var(--fg-subtle);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
.stat b{font-family:var(--font-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;color:var(--ok);font-size:.72rem;margin-left:4px}
.stat em.down{color:var(--danger)}
.stat.west{box-shadow:inset 3px 0 0 var(--you)}
.stat.east{box-shadow:inset 3px 0 0 var(--them)}
.stat.north{box-shadow:inset 3px 0 0 var(--north)}
.stat.south{box-shadow:inset 3px 0 0 var(--south)}
.ages-block{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ages-row{display:flex;align-items:center;gap:8px}
.ages-row .who{flex:0 0 52px;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.ages-row.west .who{color:var(--you)}
.ages-row.east .who{color:var(--them)}
.ages-row.north .who{color:var(--north)}
.ages-row.south .who{color:var(--south)}
.ages{display:flex;flex:1;overflow-x:auto;background:var(--bg-elevated);border:1px solid var(--border);border-radius:99px;padding:4px}
.age{flex:1;text-align:center;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);padding:5px 6px;white-space:nowrap;border-radius:99px}
.age.on{color:var(--fg);background:var(--bg-subtle)}
.age.now.west{color:#1a1814;background:var(--you);font-weight:700}
.age.now.east{color:#1c100e;background:var(--them);font-weight:700}
.age.now.north{color:#101820;background:var(--north);font-weight:700}
.age.now.south{color:#12180e;background:var(--south);font-weight:700}
.race{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.lane{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.lane .pair{display:flex;justify-content:space-between;gap:8px;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:6px}
.lane .pair b{color:var(--fg);font-weight:600;letter-spacing:0;text-transform:none;font-size:.78rem}
.dual{display:flex;flex-direction:column;gap:2px;border-radius:6px;overflow:hidden;background:#080c11;padding:3px}
.dual i{display:block;height:4px;border-radius:99px;min-width:0}
.dual i.w{background:var(--you)}
.dual i.e{background:var(--them)}
.dual i.n{background:var(--north)}
.dual i.s{background:var(--south)}
.stage{display:grid;grid-template-columns:240px 1fr 280px;gap:12px}
.panel{background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:0}
.kicker{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-subtle);font-weight:600;margin-bottom:8px}
.log{max-height:min(72vh,640px);overflow:auto;font-size:.82rem;line-height:1.4;color:var(--fg-muted)}
.log .ev{border-top:1px solid var(--border);padding:8px 0}
.log .ev b{display:block;color:var(--fg-subtle);font-size:.68rem;font-weight:600;letter-spacing:.06em}
.map-wrap{overflow:auto;background:#071018;border-radius:10px;padding:8px;position:relative;touch-action:none;-webkit-overflow-scrolling:touch}
.map-zoom{position:absolute;top:10px;left:10px;z-index:3;display:flex;align-items:center;gap:4px;background:color-mix(in oklab,var(--bg-elevated) 88%,transparent);border:1px solid var(--border);border-radius:8px;padding:3px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.map-zoom .look{height:32px;min-width:28px;padding:0 8px;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}
.map-zoom .btn{height:32px;min-width:32px;padding:0 9px}
.map-zoom .zlabel{font-family:var(--font-mono);font-size:.72rem;color:var(--fg-muted);min-width:2.8em;text-align:center}
.map-sizer{position:relative}
#map{display:grid;gap:0;width:max-content;margin:0 auto}
.cell{width:18px;height:18px;background:#2a4a28;display:flex;align-items:center;justify-content:center;font-size:0;line-height:0;color:transparent;user-select:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cell.water{background:linear-gradient(180deg,#246a88 0%,#154a62 42%,#0e3a52 100%);box-shadow:inset 0 1px 0 #4a90a8, inset 0 -2px 0 #0a2838}
.cell.shore{background:linear-gradient(180deg,#4a7a62,#2a5a48);box-shadow:inset 0 1px 0 #6a9a78}
.cell.grass-d{background:repeating-linear-gradient(90deg,#1e3e22 0 3px,#234a28 3px 6px)}
.cell.grass{background:repeating-linear-gradient(-70deg,#2a522c 0 2px,#326434 2px 4px,#2f5a30 4px 7px)}
.cell.meadow{background:repeating-linear-gradient(80deg,#3a6a32 0 3px,#4a7a3c 3px 5px)}
.cell.wood{background:radial-gradient(circle at 40% 40%,#2a4a30 0 40%,#16301c 70%)}
.cell.tree{background:radial-gradient(circle at 50% 55%,#245a30 0 38%,#14301c 68%,#0c2014 100%);border-radius:42% 42% 28% 28%}
.cell.rock{background:linear-gradient(135deg,#5a6258,#3a423c 55%,#2a302c);box-shadow:inset 1px 1px 0 #7a8278}
.cell.yard.west{background:#5a4e3a}
.cell.yard.east{background:#5a3e36}
.cell.yard.north{background:#3e4e5a}
.cell.yard.south{background:#3e5a3a}
.cell.plaza.west{background:#8a7860}
.cell.plaza.east{background:#8a5a4c}
.cell.plaza.north{background:#6a7a8a}
.cell.plaza.south{background:#6a8a60}
.cell.field.west{background:#4a7a38}
.cell.field.east{background:#6a6a34}
.cell.field.north{background:#3a6a58}
.cell.field.south{background:#4a7a40}
.cell.crop-a{background:#5a8a3c}
.cell.crop-b{background:#3d6a30}
.cell.path{background:#5a4a34}
.cell.street{background:#3a342c}
.cell.haul{background:#8a7a40}
.cell.rail,.cell.street.rail,.cell.road.rail,.cell.path.rail,.cell.haul.rail{
  background:repeating-linear-gradient(90deg,#2a2824 0 3px,#8a8a94 3px 5px,#2a2824 5px 8px);
  box-shadow:inset 0 0 0 1px #1a1814;
}
.cell.civic{background:#4a5060}
.cell.civic.east{background:#5a4048}
.cell.civic.north{background:#3a5060}
.cell.civic.south{background:#3a5040}
.cell.works{background:#4a3c30}
.cell.house.west{background:#c4a06a}
.cell.house.east{background:#b47858}
.cell.house.north{background:#8aa4b8}
.cell.house.south{background:#8ab06a}
.cell.housing.west{background:#b89468}
.cell.housing.east{background:#a86a52}
.cell.housing.north{background:#7a98a8}
.cell.housing.south{background:#7aa060}
.cell.uni{background:#2e4a5c;color:#d8e8f0;font-weight:700;box-shadow:inset 0 0 0 1px #8ab0c4}
.cell.uni.west{background:#3a4a40}
.cell.uni.east{background:#4a3840}
.cell.uni.north{background:#2e4a5c}
.cell.uni.south{background:#2e4a34}
.cell.bar{background:#6a3a38;color:#f0d0a8;font-weight:700;box-shadow:inset 0 -3px 0 #c47840}
.cell.bar.west{background:#7a4a38}
.cell.bar.east{background:#7a3834}
.cell.bar.north{background:#5a3e48}
.cell.bar.south{background:#4a4a30}
.cell.military{background:#5a3c36}
.cell.military.west{background:#6a4c38}
.cell.military.east{background:#6a3c36}
.cell.military.north{background:#3a4450}
.cell.military.south{background:#3a4a30}
.cell.house.hungry{filter:saturate(.45) brightness(.72)}
.cell.house.fed{box-shadow:inset 0 -2px 0 #c4b060}
.cell.granary{background:#6a5430}
.cell.granary.full{background:#c4a050}
.cell.granary.low{background:#8a6a30}
.cell.granary.empty{background:#3a3020}
.cell.agent,.cell.king.west{
  background:radial-gradient(circle at 35% 30%, #fff3b0, #e2b000 55%, #8a6400);
  border-radius:50%;
  color:transparent;
  box-shadow:0 0 0 2px #5a4008, 0 0 10px #e8c040;
}
.cell.rival-agent,.cell.king.east{
  background:radial-gradient(circle at 35% 30%, #f6f8fb, #b8c2cc 55%, #5a6570);
  border-radius:50%;
  color:transparent;
  box-shadow:0 0 0 2px #2e3840, 0 0 10px #c8d2dc;
}
.cell.knight.west{
  background:#d4b060;
  border-radius:3px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #6a5010, 0 0 6px #c4a040;
}
.cell.knight.east{
  background:#9aa4ae;
  border-radius:3px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a4450, 0 0 6px #b0bac4;
}
.cell.vil.west{
  background:#c4b090;
  border-radius:50%;
  color:transparent;
  box-shadow:inset 0 0 0 2px #6a5840;
}
.cell.vil.east{
  background:#8a6a62;
  border-radius:50%;
  color:transparent;
  box-shadow:inset 0 0 0 2px #4a302c;
}
.cell.scribe.west{
  background:radial-gradient(circle at 30% 25%, #f7f1e2, #d4c4a0 58%, #7a6848);
  border-radius:2px 9px 2px 9px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #5a4a30, 0 0 6px #c8b890;
}
.cell.scribe.east{
  background:radial-gradient(circle at 30% 25%, #eef3f8, #a8b6c2 58%, #3e4c56);
  border-radius:2px 9px 2px 9px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2e3a42, 0 0 6px #b0bec8;
}
.cell.builder.west{
  background:#b08650;
  border-radius:2px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #5a3c18, 0 2px 0 #6a4a20;
}
.cell.builder.east{
  background:#8a6458;
  border-radius:2px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a241c, 0 2px 0 #4a3028;
}
.cell.king.north{
  background:radial-gradient(circle at 35% 30%, #e8f2fa, #7aa0c0 55%, #2a4050);
  border-radius:50%;
  color:transparent;
  box-shadow:0 0 0 2px #1e303c, 0 0 10px #8ab4d0;
}
.cell.king.south{
  background:radial-gradient(circle at 35% 30%, #e8f4d8, #7a9a62 55%, #2a4018);
  border-radius:50%;
  color:transparent;
  box-shadow:0 0 0 2px #243818, 0 0 10px #8ab060;
}
.cell.knight.north{
  background:#7a98ac;
  border-radius:3px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2a4050, 0 0 6px #8ab0c4;
}
.cell.knight.south{
  background:#7a9a58;
  border-radius:3px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a5020, 0 0 6px #8ab060;
}
.cell.vil.north{
  background:#8aa0b0;
  border-radius:50%;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a4c58;
}
.cell.vil.south{
  background:#8aa072;
  border-radius:50%;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a4c28;
}
.cell.scribe.north{
  background:radial-gradient(circle at 30% 25%, #eef4f8, #a0b8c8 58%, #3a5060);
  border-radius:2px 9px 2px 9px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2e4048, 0 0 6px #b0c8d4;
}
.cell.scribe.south{
  background:radial-gradient(circle at 30% 25%, #eef6e4, #a8c090 58%, #3a5028);
  border-radius:2px 9px 2px 9px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2e4020, 0 0 6px #b0c898;
}
.cell.builder.north{
  background:#6a8494;
  border-radius:2px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2a3840, 0 2px 0 #3a4850;
}
.cell.builder.south{
  background:#6a8450;
  border-radius:2px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2a3818, 0 2px 0 #3a4820;
}
.cell.crew.west{
  background:#6a6258;
  border-radius:1px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a342c, 0 0 5px #8a8070;
}
.cell.crew.east{
  background:#6a524c;
  border-radius:1px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a2c28, 0 0 5px #8a7068;
}
.cell.crew.north{
  background:#4a5a66;
  border-radius:1px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2a3840, 0 0 5px #708898;
}
.cell.crew.south{
  background:#4a5a38;
  border-radius:1px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2a3818, 0 0 5px #708850;
}
.cell.train{
  background:linear-gradient(90deg,#3a3a42,#c4c4cc 40%,#2a2a30);
  border-radius:3px;
  color:#1a1814;
  font-weight:700;
  box-shadow:0 0 0 1px #111, 0 0 8px #c8c0a0;
}
.cell.train.west{box-shadow:0 0 0 1px #5a4008, 0 0 8px #e8c040}
.cell.train.east{box-shadow:0 0 0 1px #5a3028, 0 0 8px #c47a62}
.cell.train.north{box-shadow:0 0 0 1px #2a4050, 0 0 8px #7aa0c0}
.cell.train.south{box-shadow:0 0 0 1px #2a4018, 0 0 8px #7a9a62}
.cell.mill{background:#5a4a38}
.cell.mill.west{background:#6a5a40}
.cell.mill.east{background:#6a4a38}
.cell.mill.north{background:#4a5a60}
.cell.mill.south{background:#4a5a38}
.cell.mill.live{box-shadow:0 0 10px #c8a050, inset 0 0 0 1px #e8d080}
.cell.mill.dry{filter:saturate(.4) brightness(.7)}
.cell.warehouse{background:#4a4034}
.cell.warehouse.west{background:#5a4a30}
.cell.warehouse.east{background:#5a3a30}
.cell.warehouse.north{background:#3a4a50}
.cell.warehouse.south{background:#3a4a28}
.cell.wonder{

.cell.runway{

.cell.plane{

  color:#101018;
  font-weight:800;
  border-radius:6px 2px 6px 2px;

}
.cell.plane.west{box-shadow:0 0 8px #e8c040}
.cell.plane.east{box-shadow:0 0 8px #c47a62}
.cell.plane.north{box-shadow:0 0 8px #7aa0c0}

.cell.taxi{
  background:#d8b020;

  border-radius:2px;

.cell.bus{

<script>
const $=id=>document.getElementById(id);
let timer=null,lastRaidTick=-1,lastDownTick=-1,lastBreedTick=-1,lastKnightTick=-1,lastKingTick=-1,lastScribeTick=-1,lastBuilderTick=-1,lastCrewTick=-1,lastTrainTick=-1,lastPlaneTick=-1,lastTaxiTick=-1,lastBusTick=-1,lastTick=-1,lastOutcomeTick=-1,prevWorld=null,prevSample=null,paused=false,speed=2,lastSides=null,zoom=1,lookAt="island";
const GLYPH={library:"L",lab:"R",observatory:"V",barracks:"B",academy:"U",walls:"#",temple:"T",hall:"H",mill:"M",warehouse:"W",wonder:"P",airport:"F",market:"b"};
const AGES=[["camp","Camp"],["era2","Settlement"],["era3","Town"],["era4","City"],["library","Library"],["lab","Lab"],["observatory","Observatory"],["era5","Industry"],["era6","World"]];
const ERA_WORD={0:"camp",1:"camp",2:"settlement",3:"town",4:"city",5:"industry",6:"world"};
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    if(c==="&") return "&"+"amp;";
    if(c==="<") return "&"+"lt;";
    if(c===">") return "&"+"gt;";
    if(c==='"') return "&"+"#34;";
    return "&"+"#39;";
  });
}
function yearOf(tick){return tick==null?"—":"Year "+tick;}
function syncWorldSum(){
  const n=Number($("seed").value)||42;
  $("worldSum").textContent="World "+n;
}
function logLine(tick,t){
  t=String(t||"").trim();
  if(!t) return;
  const d=document.createElement("div");d.className="ev";
  if(tick!=null){const b=document.createElement("b");b.textContent=yearOf(tick);d.appendChild(b);}
  d.appendChild(document.createTextNode(t));
  $("log").prepend(d);
}
const POLES=[["player","west","West"],["rival","east","East"],["north","north","North"],["south","south","South"]];
function whoOf(f){const row=POLES.find(p=>p[0]===f);return row?row[2]:"West";}
function townsOf(world,fac){return ((world&&world.settlements)||[]).filter(s=>(s.faction||"player")===fac);}
function splitTowns(world){return{you:townsOf(world,"player"),them:townsOf(world,"rival")};}
function foodDays(s){const need=Number(s.population||0)*0.22+Number(s.soldiers||0)*0.03;if(need<=0)return null;return Number(s.food_stock||0)/need;}
function capital(towns){if(!towns.length)return null;return towns.slice().sort((a,b)=>Number(b.population||0)-Number(a.population||0))[0];}
function ownStructs(world,fac){return ((world&&world.structures)||[]).filter(s=>factionOf(world,s)===fac);}
function sum(list,k){return list.reduce((a,s)=>a+Number(s[k]||0),0);}
function factionOf(world,st){
  if(st&&st.faction) return st.faction;
  const towns=(world&&world.settlements)||[];
  let best=null,bd=1e9;
  for(const t of towns){
    if(st.x==null||t.x==null) continue;
    const d=Math.abs(Number(t.x)-Number(st.x))+Math.abs(Number(t.y)-Number(st.y));
    if(d<bd){bd=d;best=t;}
  }
  return (best&&best.faction)||"player";
}
function facName(f){const row=POLES.find(p=>p[0]===f);return row?row[1]:"west";}
function sciBits(world,fac){
  const st=ownStructs(world,fac);
  const has=t=>st.some(s=>s.type===t);
  const towns=townsOf(world,fac);
  const disc=sum(towns,"discoveries");
  const path=(has("library")?1:0)+(has("lab")?1:0)+(has("observatory")?1:0)+Math.min(2,disc);
  return {lib:has("library"),lab:has("lab"),obs:has("observatory"),disc,steps:path};
}
function ageState(world,fac){
  const towns=townsOf(world,fac);
  const sci=sciBits(world,fac);
  const era=towns.reduce((a,s)=>Math.max(a,Number(s.era||2)),0);
  const on={camp:true,era2:towns.length>0,era3:era>=3,era4:era>=4,library:sci.lib,lab:sci.lab,observatory:sci.obs,era5:era>=5,era6:era>=6};
  let now="camp";for(const [id] of AGES) if(on[id]) now=id;
  return {on,now,era,sci,people:sum(towns,"population"),soldiers:sum(towns,"soldiers"),cap:capital(towns),live:towns.some(t=>t.mill_live),power:towns.reduce((a,t)=>a+Number(t.power||0),0),wonder:ownStructs(world,fac).some(s=>s.type==="wonder"),uni:ownStructs(world,fac).some(s=>s.type==="academy"),bar:ownStructs(world,fac).some(s=>s.type==="market")};
}
function ranksOf(world,fac){
  const hands=((world&&world.agents)||[]).filter(a=>(a.faction||"player")===fac);
  const king=hands.find(a=>(a.role||"walker")==="king");
  const knight=hands.find(a=>(a.role||"walker")==="knight");
  const scribe=hands.find(a=>(a.role||"walker")==="scribe");
  const builder=hands.find(a=>(a.role||"walker")==="builder");
  const crew=hands.find(a=>(a.role||"walker")==="crew");
  const hall=ownStructs(world,fac).some(s=>s.type==="hall");
  const capCrown=(function(){
    const towns=townsOf(world,fac);
    const cap=capital(towns);
    return cap&&cap.crown;
  })();
  return {
    hands:hands.length,
    crown:(king&&(king.agent_id||king.id))||capCrown||null,
    knight:knight&&(knight.agent_id||knight.id)||null,
    scribe:scribe&&(scribe.agent_id||scribe.id)||null,
    builder:builder&&(builder.agent_id||builder.id)||null,
    crew:crew&&(crew.agent_id||crew.id)||null,
    hall
  };
}
function sidesOf(world){
  const out={};
  for(const [fac,cls,label] of POLES){
    const side=ageState(world||{},fac);
    side.ranks=ranksOf(world||{},fac);
    side.cls=cls;
    side.label=label;
    side.fac=fac;
    out[fac]=side;
    out[cls]=side;
  }
  return out;
}
function orderOf(id){return AGES.findIndex(([k])=>k===id);}
function fmtRate(cur,key){if(!prevSample)return "";const dt=Number(cur.tick||0)-Number(prevSample.tick||0);if(dt<=0)return "";const r=(Number(cur[key]||0)-Number(prevSample[key]||0))/dt*100;if(!isFinite(r)||Math.abs(r)<0.05)return "";return `${r>=0?"+":""}${r.toFixed(1)}`;}
function renderAges(world){
  const sides=sidesOf(world);
  const row=(side)=>`<div class="ages-row ${side.cls}"><div class="who">${side.label}</div><div class="ages">${AGES.map(([id,name])=>`<div class="age ${id===side.now?"now "+side.cls:(side.on[id]?"on":"")}">${name}</div>`).join("")}</div></div>`;
  $("ages").innerHTML=POLES.map(([fac])=>row(sides[fac])).join("");
  const map=$("map");
  map.classList.remove("age-camp","age-settlement","age-town","age-city","age-science","age-industry","age-world");
  const order=s=>orderOf(s.now);
  const lead=POLES.map(([fac])=>sides[fac]).sort((a,b)=>order(b)-order(a))[0];
  if(lead.on.era6) map.classList.add("age-world");
  else if(lead.on.era5) map.classList.add("age-industry");
  else if(lead.on.library||lead.on.lab||lead.on.observatory) map.classList.add("age-science");
  else if(lead.on.era4) map.classList.add("age-city");
  else if(lead.on.era3) map.classList.add("age-town");
  else if(lead.on.era2) map.classList.add("age-settlement");
  else map.classList.add("age-camp");
}
function sampleOf(world){
  const s=sidesOf(world);
  const tot=(world&&world.totals)||{};
  return {tick:world&&world.tick,wp:s.west.people,ep:s.east.people,np:s.north.people,sp:s.south.people,ws:s.west.soldiers,es:s.east.soldiers,ns:s.north.soldiers,ss:s.south.soldiers,food:tot.food,wood:tot.wood,stone:tot.stone};
}

function renderRace(world){

function folkBlock(side,title,barCls){
  const cap=side.cap;
  const days=cap?foodDays(cap):null;
  const fill=days==null?0:Math.max(0,Math.min(100,(days/20)*100));
  const low=days!=null&&days<3;
  const eraWord=ERA_WORD[side.era]||"camp";
  const rk=side.ranks||{hands:0,crown:null,hall:false,knight:null,scribe:null,builder:null};
  let lead="Still walking.";
  if(cap&&days!=null&&days<1) lead=`${side.people} souls. Granary empty — food is short.`;
  else if(cap&&days!=null&&days<3) lead=`${side.people} souls. Only ${Math.floor(days)} days of food.`;
  else if(cap) lead=`${side.people} souls. A ${eraWord}.`;
  if(rk.crown&&rk.hall) lead+=(lead.endsWith(".")?" ":"")+"A king sits in the hall.";
  else if(rk.crown) lead+=(lead.endsWith(".")?" ":"")+"A king is crowned.";
  if(rk.scribe) lead+=(lead.endsWith(".")?" ":"")+"A scribe keeps the library.";
  if(rk.builder) lead+=(lead.endsWith(".")?" ":"")+"A builder works the civic yard.";
  if(rk.crew) lead+=(lead.endsWith(".")?" ":"")+"A rail crew walks the line.";
  if(side.era>=5) lead+=(lead.endsWith(".")?" ":"")+"The roads are rail.";
  if(side.live) lead+=(lead.endsWith(".")?" ":"")+"The mill turns.";
  else if((side.era>=5)||(side.ranks&&side.ranks.crew)) lead+=(lead.endsWith(".")?" ":"")+"The mill is dry.";
  const goods=Number((side.cap&&side.cap.goods_stock)||0);
  if(goods>0) lead+=(lead.endsWith(".")?" ":"")+"Goods in the warehouse.";
  if(side.wonder) lead+=(lead.endsWith(".")?" ":"")+"A wonder stands.";
  if(side.uni) lead+=(lead.endsWith(".")?" ":"")+"A university stands.";
  if(side.bar) lead+=(lead.endsWith(".")?" ":"")+"A bar sits on the street.";
  if(side.era>=6) lead+=(lead.endsWith(".")?" ":"")+"Planes leave the field.";
  if(side.era>=6) lead+=(lead.endsWith(".")?" ":"")+"Cabs and buses work the streets.";
  const bits=[];
  if(rk.crown) bits.push("Crown "+rk.crown);
  else if(rk.knight) bits.push("Knight "+rk.knight);

  if(rk.builder) bits.push("builder "+rk.builder);

  const rankLine=bits.join(" · ");
  const disc=side.sci.disc;
  const discWord=disc===1?"1 discovery":(disc?disc+" discoveries":"no discoveries");
  const sci=`${discWord}${side.sci.obs?" · observatory":(side.sci.lab?" · lab":(side.sci.lib?" · library":""))}`;
  const chips=((cap&&cap.subjects)||[]).map(sub=>`<span class="chip">${esc(sub)}</span>`).join("");
  return `<div class="folk"><div class="kicker">${title}</div>
    <h2>${cap?esc(cap.id)+" · "+eraWord:"No town yet"}</h2>
    <p class="lead">${esc(lead)}</p>
    <p class="lead">${esc(rankLine)}</p>
    <div class="meter"><label><span>Food days</span><span>${days==null?"—":(days<1?"short":Math.floor(days)+"d")}</span></label><div class="bar ${low?"low":""} ${barCls}"><i style="width:${fill.toFixed(0)}%"></i></div></div>
    <div class="meter"><label><span>Science</span><span>${esc(sci)}</span></label><div class="bar ${barCls}"><i style="width:${Math.min(100,side.sci.steps/5*100)}%"></i></div></div>
    <div class="meter"><label><span>Military</span><span>${side.soldiers.toFixed(1)}</span></label><div class="bar ${barCls}"><i style="width:${Math.min(100,side.soldiers*8)}%"></i></div></div>
    <div class="meter"><label><span>Power</span><span>${side.live?"live":(side.era>=5?"dry":"—")}</span></label><div class="bar ${barCls}"><i style="width:${side.live?100:0}%"></i></div></div>
    ${chips}</div>`;
}
function renderCity(world){

function hash(x,y){return Math.abs((x*19+y*37+(x*y*7))%256);}
function n01(x,y){return hash(x,y)/255;}
function elev(x,y){return n01(x,y)*0.5 + n01(x>>1,y>>1)*0.32 + n01((x+5)>>2,(y+3)>>2)*0.18;}
function strokePath(set,x0,y0,x1,y1,rail){
  let x=x0,y=y0;
  while(x!==x1||y!==y1){
    if(x!==x1) x+=x1>x?1:-1;
    else if(y!==y1) y+=y1>y?1:-1;
    set(x,y,rail?"street rail":"street","", rail?"rail":"street", 2);
  }
}
function strokeHaul(set,x0,y0,x1,y1,rail){
  let x=x0,y=y0;
  while(x!==x1||y!==y1){
    if(x!==x1) x+=x1>x?1:-1;
    else if(y!==y1) y+=y1>y?1:-1;
    set(x,y,rail?"haul rail":"haul","",rail?"rail haul":"grain road",3);
  }
}
function paintLand(w,h,set){
  const kind=Array.from({length:h},()=>Array(w).fill("grass"));
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const e=elev(x,y);
    const lake=n01(x>>2,y>>2);
    const grove=n01((x+5)>>2,(y+2)>>2);
    const patch=n01((x+2)>>2,(y+7)>>2);
    let k="grass";
    if(e<0.28) k="water";
    else if(e<0.34) k="shore";
    else if(e<0.44) k="grass-d";
    else if(e<0.60) k="grass";
    else if(e<0.76) k="meadow";
    else k="rock";
    if(lake>0.78 && e>0.26 && e<0.58) k="water";
    if(k!=="water" && grove>0.64 && e>0.36 && e<0.74) k=(n01(x,y+3)>0.42)?"tree":"wood";
    if((k==="grass"||k==="grass-d") && patch>0.52 && patch<0.68 && e>0.40) k="meadow";
    kind[y][x]=k;
  }
  let ry=6+(hash(2,9)%10);
  for(let x=0;x<w;x++){
    kind[ry][x]="water";
    if(ry>2) kind[ry-1][x]=(kind[ry-1][x]==="water")?"water":"shore";
    if(ry<h-3) kind[ry+1][x]=(kind[ry+1][x]==="water")?"water":"shore";
    const step=hash(x,ry)%4;
    if(step===0 && ry>3) ry--;
    else if(step===1 && ry<h-4) ry++;
  }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(kind[y][x]!=="water"){
      let adj=0;
      if(x&&kind[y][x-1]==="water") adj++;
      if(x<w-1&&kind[y][x+1]==="water") adj++;
      if(y&&kind[y-1][x]==="water") adj++;
      if(y<h-1&&kind[y+1][x]==="water") adj++;
      if(adj>=1 && (kind[y][x]==="grass"||kind[y][x]==="grass-d"||kind[y][x]==="meadow")) kind[y][x]="shore";
    }
    set(x,y,kind[y][x],"","",0);
  }
}
function faceClass(kind,id,x,y){
  const key=kind+":"+id;
  const store=window.__vehFace||(window.__vehFace={});
  const prev=store[key];
  let face="face-e";
  if(prev){
    if(x>prev.x) face="face-e";
    else if(x<prev.x) face="face-w";
    else if(y>prev.y) face="face-s";
    else if(y<prev.y) face="face-n";
    else face=prev.face||"face-e";
  }
  store[key]={x:x,y:y,face:face};
  return face;
}
function renderMap(world){
  if(!world) return;
  const w=world.width||48,h=world.height||48,map=$("map");
  const size=(map.classList.contains("age-town")||map.classList.contains("age-city")||map.classList.contains("age-science")||map.classList.contains("age-industry")||map.classList.contains("age-world"))?22:18;
  map.style.gridTemplateColumns=`repeat(${w}, ${size}px)`;
  const occ={};
  function set(x,y,cls,mark,title,z){
    if(x<0||y<0||x>=w||y>=h) return;
    const k=x+","+y;
    if(!occ[k]||occ[k].z<=z) occ[k]={cls,mark:mark||"",title:title||"",z};
  }
  paintLand(w,h,set);
  function wet(x,y){
    const c=occ[x+","+y];
    return !c || c.cls==="water";
  }
  const towns=world.settlements||[];
  const townDays={};
  for(const town of towns) townDays[town.id]=foodDays(town);
  for(const town of towns){
    const era=Number(town.era||2);
    const pop=Number(town.population||0);
    const r=Math.min(11, 2+(era>=6?5:era>=5?4:era>=4?3:era>=3?1:0)+Math.floor(pop/14));
    const fn=facName(town.faction);
    const days=townDays[town.id];
    const hungry=days!=null&&days<1;
    const fed=days!=null&&days>=3;
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.abs(dx)+Math.abs(dy)>r) continue;
      const tx=town.x+dx, ty=town.y+dy;
      if(wet(tx,ty)) continue;
      const ring=Math.abs(dx)+Math.abs(dy);
      const street=(dx%3===0||dy%3===0)&&!(dx===0&&dy===0);
      let cls;
      if(street) cls="street";
      else if(ring<=2) cls="plaza "+fn;
      else if(era>=4 && ring<=6) cls="housing "+fn;
      else cls="yard "+fn;
      const z=street?2:(ring<=2?3:1);
      set(tx,ty,cls,"",town.id+(street?" street":(ring<=2?" square":(era>=4&&ring<=6?" housing":" district"))),z);
    }
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(!wet(town.x+dx,town.y+dy)) set(town.x+dx,town.y+dy,"plaza "+fn,"",town.id+" square",4);
    }
    const homes=era>=4?Math.min(56, Math.max(14, Math.floor(pop/2.4))):Math.min(36, Math.floor(pop/5));
    const mx=(w-1)/2, my=(h-1)/2;
    const slots=[];
    for(let ring=2;ring<=10;ring++){
      for(let dy=-ring;dy<=ring;dy++) for(let dx=-ring;dx<=ring;dx++){
        if(Math.abs(dx)<=1 && Math.abs(dy)<=1) continue;
        if(Math.abs(dx)+Math.abs(dy)>ring+1) continue;
        const hx=town.x+dx, hy=town.y+dy;
        if(hx<0||hy<0||hx>=w||hy>=h) continue;
        if(wet(hx,hy)) continue;
        slots.push({x:hx,y:hy, inward:Math.abs(hx-mx)+Math.abs(hy-my), ring:Math.abs(dx)+Math.abs(dy)});
      }
    }
    slots.sort((a,b)=>a.inward-b.inward || a.ring-b.ring);
    const used={};
    let placed=0;
    for(const s of slots){
      if(placed>=homes) break;
      const k=s.x+","+s.y;
      if(used[k]) continue;
      const cell=occ[k];
      if(cell && (cell.cls==="water"||cell.z>=6)) continue;
      used[k]=1;
      set(s.x,s.y,"house "+fn+(hungry?" hungry":(fed?" fed":"")),"",town.id+(hungry?" hungry":" house"),5);
      placed++;
    }
    if(era<4){
      const tents=Math.min(20, Math.floor(Number(town.soldiers||0)/7));
      if(tents){
        const camps=(world.structures||[]).filter(s=>s.type==="barracks"&&factionOf(world,s)===(town.faction||"player"));
        const bx=camps[0]?camps[0].x:town.x+2, by=camps[0]?camps[0].y:town.y-2;
        for(let i=0;i<tents;i++){
          const hx=bx+(i%5)-2, hy=by+Math.floor(i/5)-1;
          const cell=occ[hx+","+hy];
          if(cell && (cell.cls==="water"||cell.z>=6)) continue;

        }
      }
    }
  }
  const CIVIC={academy:1,library:1,lab:1,observatory:1,temple:1,hall:1,market:1,wonder:1};
  const WORKS={workshop:1,foundry:1,mine:1,mill:1,warehouse:1};
  for(const st of world.structures||[]){
    const fn=facName(factionOf(world,st));

  }

  for(const fac of ["player","rival","north","south"]){

    if(st.type==="wonder"){
      for(let dy=0;dy<=2;dy++) for(let dx=0;dx<=2;dx++){
        set(st.x+dx,st.y+dy,skin,dx===1&&dy===0?mark:"",(fn+" wonder"),8);
      }
    }
    if(st.type==="airport"){
      for(let dx=1;dx<=4;dx++){
        if(!wet(st.x+dx,st.y)) set(st.x+dx,st.y,"runway","",(fn+" runway"),5);
      }
    }
  }
  for(const town of towns){
    set(town.x,town.y,"settlement "+facName(town.faction||"player"),"",town.id,7);
  }
  const byFac={player:[],rival:[],north:[],south:[]};
  for(const a of world.agents||[]){
    const fac=a.faction||"player";
    (byFac[fac]||byFac.player).push(a);
  }
  for(const fac of ["player","rival","north","south"]){
    const list=byFac[fac];
    list.forEach(a=>{
      const fn=facName(fac);
      const role=a.role||"walker";
      const skin=role==="king"?("king "+fn)
        :(role==="knight"?("knight "+fn)
        :(role==="scribe"?("scribe "+fn)
        :(role==="builder"?("builder "+fn)
        :(role==="crew"?("crew "+fn)
        :("vil "+fn)))));
      const title=role==="king"?(fn+" king")
        :(role==="knight"?(fn+" knight")
        :(role==="scribe"?(fn+" scribe")
        :(role==="builder"?(fn+" builder")
        :(role==="crew"?(fn+" rail crew")
        :(fn+" walker")))));
      set(a.x,a.y,skin,"",title,9);
    });
  }
  for(const tr of world.trains||[]){
    const fn=facName(tr.faction||"player");
    const cargo=Number(tr.cargo||0)?" loaded":"";
    set(tr.x,tr.y,"train "+fn+" "+faceClass("train",tr.id||fn,tr.x,tr.y),"",(fn+" train"+cargo),10);
  }
  for(const pl of world.planes||[]){
    const fn=facName(pl.faction||"player");
    set(pl.x,pl.y,"plane "+fn+" "+faceClass("plane",pl.id||fn,pl.x,pl.y),"",(fn+" plane"),11);
  }
  for(const cab of world.taxis||[]){
    const fn=facName(cab.faction||"player");
    set(cab.x,cab.y,"taxi "+fn+" "+faceClass("taxi",cab.id||fn,cab.x,cab.y),"",(fn+" taxi"),10);
  }
  for(const bus of world.buses||[]){
    const fn=facName(bus.faction||"player");
    set(bus.x,bus.y,"bus "+fn+" "+faceClass("bus",bus.id||fn,bus.x,bus.y),"",(fn+" bus"),10);
  }
  let html="";
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const c=occ[x+","+y]||{cls:"grass",mark:"",title:""};
    html+=`<div class="cell ${c.cls}"${c.title?` title="${esc(c.title)}"`:""}>${c.mark||""}</div>`;
  }
  map.innerHTML=html;
  applyZoom();
}
function chronicleDiff(world){
  if(!prevWorld){prevWorld=world;return;}
  const tick=world.tick, oldBy={};
  for(const s of prevWorld.settlements||[]) oldBy[s.id]=s;
  for(const s of world.settlements||[]){
    const o=oldBy[s.id];
    const who=whoOf(s.faction);
    if(!o){logLine(tick,`${who} founded ${s.id}.`);continue;}
    if(Number(s.era||2)>Number(o.era||2)) logLine(tick,`${who} ${s.id} became a ${ERA_WORD[s.era]||("era "+s.era)}.`);
    const had=new Set(o.subjects||[]);
    for(const sub of (s.subjects||[])) if(sub&&!had.has(sub)) logLine(tick,`${who} ${s.id} unlocked ${sub}.`);
    if(Number(s.discoveries||0)>Number(o.discoveries||0)) logLine(tick,`${who} ${s.id} made a discovery (${s.discoveries}).`);
    if(Number(s.population||0)+2<Number(o.population||0)) logLine(tick,`${who} ${s.id} lost people.`);
  }
  const risen={library:"A library rose",lab:"A lab rose",observatory:"An observatory rose",barracks:"Barracks rose",academy:"A university rose",farm:"Fields spread",mill:"A mill rose",foundry:"A foundry smoked",warehouse:"A warehouse rose",wonder:"A wonder rose",airport:"An airport rose",market:"A bar opened on the street"};
  for(const [typ,line] of Object.entries(risen)){
    const n=(wld,fac)=>ownStructs(wld,fac).filter(s=>s.type===typ).length;
    if(n(world,"player")>n(prevWorld,"player")) logLine(tick,`${line} in the west.`);
    if(n(world,"rival")>n(prevWorld,"rival")) logLine(tick,`${line} in the east.`);
    if(n(world,"north")>n(prevWorld,"north")) logLine(tick,`${line} in the north.`);
    if(n(world,"south")>n(prevWorld,"south")) logLine(tick,`${line} in the south.`);
  }
  prevWorld=world;
}
function raceLine(world){
  if(!world) return "";
  const s=sidesOf(world);
  const poles=POLES.map(([fac])=>s[fac]);
  if(poles.every(p=>!p.cap)) return "All still walking.";
  const sciLead=[...poles].sort((a,b)=>b.sci.steps-a.sci.steps);
  if(sciLead[0].sci.steps>sciLead[1].sci.steps) return `${sciLead[0].label} leads the science path (${sciLead[0].sci.steps} vs ${sciLead[1].sci.steps}).`;
  const ageLead=[...poles].sort((a,b)=>orderOf(b.now)-orderOf(a.now));
  if(orderOf(ageLead[0].now)>orderOf(ageLead[1].now)) return `${ageLead[0].label} leads the ages — ${AGES.find(a=>a[0]===ageLead[0].now)[1]}.`;
  const popLead=[...poles].sort((a,b)=>b.people-a.people);
  if(popLead[0].people>popLead[1].people) return `Even on the path. ${popLead[0].label} has more people (${popLead[0].people}).`;
  return `Even — four poles on the same island.`;
}
function holdTitle(winner){
  if(winner==="player") return "The west holds";
  if(winner==="rival") return "The east holds";
  if(winner==="north") return "The north holds";
  if(winner==="south") return "The south holds";
  return "Even";
}
function renderEpilogue(state){
  const box=$("epilogue");
  const o=state.outcome;
  if(!o||!o.winner){box.className="epilogue";box.innerHTML="";return;}
  const s=lastSides||sidesOf(state.world||{});
  const live=state.status==="running"||state.status==="paused";
  const sideHtml=(side,name,held)=>`<div class="side${held?" held":""}"><div class="k">${name}${held?" · holds":""}</div>
    <h4>${side.cap?esc(side.cap.id):"No town"} · ${esc(ERA_WORD[side.era]||"camp")}</h4>
    <p>${side.people} souls · science ${side.sci.steps}/5${side.sci.disc?(" · "+side.sci.disc+" discoveries"):""} · army ${side.soldiers.toFixed(1)}</p></div>`;
  box.className="epilogue show"+(live?" live":"");
  box.innerHTML=`<p class="eyebrow">${live?"They hold · the ages continue":"Chapter closed"} · ${esc(o.kind||"outcome")}</p>
    <h3>${esc(holdTitle(o.winner))}</h3>
    <p class="why">${esc(o.reason||"")}${live?" The land keeps growing.":""}</p>
    <div class="sides">${POLES.map(([fac])=>sideHtml(s[fac],s[fac].label,o.winner===fac)).join("")}</div>
    <div class="score">Score ${esc(state.score??"—")} · ${esc(yearOf(o.tick??lastTick))}</div>`;
}
function renderBanner(state){
  const banner=$("statusBanner");
  const o=state.outcome||{};
  if(state.status==="done"){
    const w=o.winner||"";
    banner.className="banner "+(w&&w!=="draw"?"win":(w==="draw"?"":""));
    banner.textContent=w?`${holdTitle(w)} · ${o.kind||"outcome"}. Clock ended.`:(`Finished · Score ${state.score??"—"}.`);
  } else if(state.status==="error"){banner.className="banner lose";banner.textContent="Could not run. Hit Watch again.";$("begin").disabled=false;}
  else if(o.winner){banner.className="banner "+(o.winner!=="draw"?"win":"");banner.textContent=`${holdTitle(o.winner)} · ${o.kind||"outcome"}. The ages continue.`;}
  else if(state.paused){banner.className="banner";banner.textContent="Paused. "+raceLine(state.world);}
  else if(state.status==="running"){banner.className="banner";banner.textContent=raceLine(state.world)||"The ages are turning.";}
  else {banner.className="banner";banner.textContent="Open a world and watch. · v29";}
  renderEpilogue(state);
}
async function poll(){
  const state=await (await fetch("/api/state")).json();
  paused=!!state.paused; $("pauseBtn").textContent=paused?"Resume":"Pause";
  const world=state.world;
  if(world&&world.outcome&&!state.outcome) state.outcome=world.outcome;
  if(world&&world.tick!==lastTick){
    lastTick=world.tick; renderAges(world); renderHud(world); renderRace(world); renderMap(world); renderCity(world); chronicleDiff(world); prevSample=sampleOf(world); parkCamera(world);
    const raid=(world.metrics||{}).last_raid;
    if(raid&&raid.tick!==lastRaidTick){lastRaidTick=raid.tick;logLine(world.tick,`${whoOf(raid.attacker_faction)} raided ${raid.target}.`);}
    const down=(world.metrics||{}).last_stand_down;
    if(down&&down.tick!==lastDownTick){
      lastDownTick=down.tick;
      const who=whoOf(down.faction);
      logLine(world.tick,`${who} stood the army down — the granary was short.`);
    }
    const born=(world.metrics||{}).last_breed;
    if(born&&born.tick!==lastBreedTick){
      lastBreedTick=born.tick;
      const who=whoOf(born.faction);
      logLine(world.tick,`${who} gained a walker (${born.agent_id}) · ${born.hands_after} hands.`);
    }
    const kn=(world.metrics||{}).last_knight;
    if(kn&&kn.tick!==lastKnightTick){
      lastKnightTick=kn.tick;
      const who=whoOf(kn.faction);
      logLine(world.tick,`${who} raised a knight · ${kn.agent_id}.`);
    }
    const kg=(world.metrics||{}).last_king;
    if(kg&&kg.tick!==lastKingTick){
      lastKingTick=kg.tick;
      const who=whoOf(kg.faction);
      logLine(world.tick,`${who} crowned ${kg.agent_id}.`);
    }
    const sc=(world.metrics||{}).last_scribe;
    if(sc&&sc.tick!==lastScribeTick){
      lastScribeTick=sc.tick;
      const who=whoOf(sc.faction);
      logLine(world.tick,`${who} named a scribe · ${sc.agent_id}.`);
    }
    const bd=(world.metrics||{}).last_builder;
    if(bd&&bd.tick!==lastBuilderTick){
      lastBuilderTick=bd.tick;
      const who=whoOf(bd.faction);
      logLine(world.tick,`${who} named a builder · ${bd.agent_id}.`);
    }
    const cr=(world.metrics||{}).last_crew;
    if(cr&&cr.tick!==lastCrewTick){
      lastCrewTick=cr.tick;
      const who=whoOf(cr.faction);
      logLine(world.tick,`${who} named a rail crew · ${cr.agent_id}.`);
    }
    const trn=(world.metrics||{}).last_train;
    if(trn&&trn.tick!==lastTrainTick){
      lastTrainTick=trn.tick;
      const who=whoOf(trn.faction);
      logLine(world.tick,`${who} rolled a train · ${trn.train_id}.`);
    }
    const pln=(world.metrics||{}).last_plane;
    if(pln&&pln.tick!==lastPlaneTick){
      lastPlaneTick=pln.tick;
      const who=whoOf(pln.faction);
      logLine(world.tick,`${who} launched a plane · ${pln.plane_id}.`);
    }
    const tx=(world.metrics||{}).last_taxi;
    if(tx&&tx.tick!==lastTaxiTick){
      lastTaxiTick=tx.tick;
      logLine(world.tick,`${whoOf(tx.faction)} put a cab on the square · ${tx.taxi_id}.`);
    }
    const bs=(world.metrics||{}).last_bus;
    if(bs&&bs.tick!==lastBusTick){
      lastBusTick=bs.tick;
      logLine(world.tick,`${whoOf(bs.faction)} ran a bus · ${bs.bus_id}.`);
    }
  }
  renderBanner(state);
  if(state.outcome&&state.outcome.winner&&lastOutcomeTick<0){
    lastOutcomeTick=state.outcome.tick!=null?state.outcome.tick:(lastTick>=0?lastTick:0);
    window.__holdYear=lastOutcomeTick;
    const o=state.outcome;
    const {west,east}=lastSides||sidesOf(world||{});
    logLine(lastOutcomeTick,`${holdTitle(o.winner)} — ${o.kind||"outcome"}: ${o.reason||""} The ages continue.`);
    logLine(lastOutcomeTick,`West ${west.people} souls · ${ERA_WORD[west.era]||"camp"} · science ${west.sci.steps}/5. East ${east.people} souls · ${ERA_WORD[east.era]||"camp"} · science ${east.sci.steps}/5.`);
  }
  if(state.status==="done"){
    if(world){renderAges(world);renderHud(world);renderRace(world);renderMap(world);renderCity(world);parkCamera(world);}
    logLine(lastTick>=0?lastTick:null,`Clock ended. Score ${state.score??"—"}`);
    clearInterval(timer);timer=null;$("begin").disabled=false;$("pauseBtn").disabled=true;
  }
}
async function begin(){
  $("begin").disabled=true;$("pauseBtn").disabled=false;$("pauseBtn").textContent="Pause";
  $("log").innerHTML="";lastTick=-1;lastRaidTick=-1;lastDownTick=-1;lastBreedTick=-1;lastKnightTick=-1;lastKingTick=-1;lastScribeTick=-1;lastBuilderTick=-1;lastCrewTick=-1;lastTrainTick=-1;lastPlaneTick=-1;lastTaxiTick=-1;lastBusTick=-1;lastOutcomeTick=-1;window.__holdYear=null;prevWorld=null;prevSample=null;paused=false;lastSides=null;
  $("epilogue").className="epilogue";$("epilogue").innerHTML="";
  const seed=Number($("seed").value)||42, ticks=Number($("ticks").value)||8000;
  syncWorldSum();
  logLine(null,`A world opens. The clock runs ${ticks} years.`);
  try{const res=await fetch("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({seed,ticks,speed})}); if(!res.ok) throw new Error("start");}
  catch(e){logLine(null,"Could not start. Hit Watch again.");$("begin").disabled=false;return;}
  if(timer) clearInterval(timer); timer=setInterval(poll,280); poll();
}
function applyZoom(){
  const map=$("map"), sizer=$("mapSizer"), lab=$("zoomLabel");
  if(!map||!sizer) return;
  map.style.transform="scale("+zoom+")";
  map.style.transformOrigin="0 0";
  const w=map.offsetWidth||0, h=map.offsetHeight||0;
  sizer.style.width=Math.max(1,Math.round(w*zoom))+"px";
  sizer.style.height=Math.max(1,Math.round(h*zoom))+"px";
  if(lab) lab.textContent=(Math.round(zoom*10)/10)+"×";
  markLook();
}
function markLook(){
  document.querySelectorAll("[data-look]").forEach(b=>b.classList.toggle("on", b.dataset.look===lookAt));
  const island=$("zoomReset");
  if(island) island.classList.toggle("on", lookAt==="island");
}
function parkCamera(world){
  const wrap=$("mapWrap"), map=$("map");
  if(!wrap||!map||lookAt==="island") return;
  const s=sidesOf(world||{});
  const side=s[lookAt];
  const cap=side&&side.cap;
  if(!cap||cap.x==null) return;
  const cell=map.querySelector(".cell");
  const cw=(cell&&cell.offsetWidth)||20;
  const ch=(cell&&cell.offsetHeight)||20;
  const x=Number(cap.x)*cw*zoom - wrap.clientWidth*0.45;
  const y=Number(cap.y)*ch*zoom - wrap.clientHeight*0.45;
  wrap.scrollLeft=Math.max(0,x);
  wrap.scrollTop=Math.max(0,y);
}
function lookPole(name){
  lookAt=name;
  if(name==="island"){ fitMap(); markLook(); return; }
  setZoom(2.2);
  parkCamera(prevWorld||{});
  markLook();
}
function fitMap(){
  const wrap=$("mapWrap"), map=$("map");
  if(!wrap||!map||!map.offsetWidth) return;
  const sx=(wrap.clientWidth-24)/map.offsetWidth;
  setZoom(Math.max(0.6, Math.min(1.4, sx)));
}
function setZoom(z){
  zoom=Math.round(Math.min(3,Math.max(0.6,z))*100)/100;
  applyZoom();
}
async function setControl(payload){await fetch("/api/control",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});}
$("begin").onclick=begin;
$("pauseBtn").onclick=()=>setControl({paused:!paused});
$("seed").addEventListener("input",syncWorldSum);
$("zoomIn").onclick=()=>setZoom(zoom+0.25);
$("zoomOut").onclick=()=>setZoom(zoom-0.25);
$("zoomReset").onclick=()=>lookPole("island");
document.querySelectorAll("[data-look]").forEach(btn=>{
  btn.onclick=()=>lookPole(btn.dataset.look);
});
(function(){
  const wrap=$("mapWrap");
  if(!wrap) return;
  wrap.addEventListener("wheel",function(e){
    if(!(e.ctrlKey||e.metaKey)) return;
    e.preventDefault();
    setZoom(zoom*(e.deltaY<0?1.12:0.9));
  },{passive:false});
  let pinch0=0;
  wrap.addEventListener("touchstart",function(e){
    if(e.touches.length===2){
      const a=e.touches[0], b=e.touches[1];
      pinch0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    }
  },{passive:true});
  wrap.addEventListener("touchmove",function(e){
    if(e.touches.length!==2||!pinch0) return;
    e.preventDefault();
    const a=e.touches[0], b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    setZoom(zoom*(d/pinch0));
    pinch0=d;
  },{passive:false});
})();
document.querySelectorAll("[data-speed]").forEach(btn=>{btn.onclick=()=>{speed=Number(btn.dataset.speed);document.querySelectorAll("[data-speed]").forEach(b=>b.classList.toggle("on",b===btn));setControl({speed});};});
syncWorldSum();
renderAges({});renderHud({});renderRace({});renderCity({});
renderMap({width:48,height:48,settlements:[],structures:[],agents:[]});
fitMap();
(async()=>{
  try{
    const state=await (await fetch("/api/state")).json();
    if(state.status==="running"||state.status==="paused"||state.status==="done"){
      $("begin").disabled=state.status!=="done";
      $("pauseBtn").disabled=state.status==="done";
      if(state.status!=="done"){if(timer)clearInterval(timer);timer=setInterval(poll,280);}
      poll();
    }
  }catch(e){}
})();
