<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>AI-world</title>
<meta http-equiv="Cache-Control" content="no-store"/>
<style>
:root {
  --bg:#0b1016; --bg-elevated:#121821; --bg-subtle:#18202b;
  --fg:#e7eef6; --fg-muted:#8b9aab; --fg-subtle:#5d6b7a;
  --border: color-mix(in oklab, var(--fg) 10%, transparent);
  --accent:#c9d4e0; --accent-fg:#0b1016; --ok:#6fbf8a; --danger:#c45b55;
  --you:#d8d2c6; --them:#c47a62; --north:#7aa0c0; --south:#7a9a62;
  --font-display:"Iowan Old Style", Palatino, Georgia, serif;
  --font-body:"Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);min-height:100%}
button,[role=button]{cursor:pointer} button:disabled{cursor:default;opacity:.4}
.shell{width:min(1320px,calc(100% - 24px));margin:0 auto;padding:16px 0 28px;container-type:inline-size;container-name:shell}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:600;letter-spacing:-.03em;font-size:1.55rem;margin:0}
.sub{color:var(--fg-muted);font-size:.85rem;margin-top:2px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.kicker{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-subtle);font-weight:600}
input[type=number]{height:34px;width:80px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:0 8px;font:inherit;margin-left:6px}
.btn{height:38px;border:0;border-radius:8px;padding:0 14px;font:600 .88rem var(--font-body)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border)}
.btn.on{border-color:var(--ok);color:var(--ok)}
.world-box{border:1px solid var(--border);border-radius:10px;padding:6px 10px;background:var(--bg-elevated);min-width:140px}
.world-box summary{cursor:pointer;list-style:none;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);font-weight:700}
.world-box summary::-webkit-details-marker{display:none}
.world-box[open]{position:relative;z-index:2}
.world-box .drawer{display:flex;gap:10px;padding-top:8px;flex-wrap:wrap}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(11rem,100%),1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.stat span{display:block;color:var(--fg-subtle);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
.stat b{font-family:var(--font-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;color:var(--ok);font-size:.72rem;margin-left:4px}
.stat em.down{color:var(--danger)}
.stat.west{box-shadow:inset 3px 0 0 var(--you)}
.stat.east{box-shadow:inset 3px 0 0 var(--them)}
.stat.north{box-shadow:inset 3px 0 0 var(--north)}
.stat.south{box-shadow:inset 3px 0 0 var(--south)}
.ages-block{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ages-row{display:flex;align-items:center;gap:8px}
.ages-row .who{flex:0 0 52px;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.ages-row.west .who{color:var(--you)}
.ages-row.east .who{color:var(--them)}
.ages-row.north .who{color:var(--north)}
.ages-row.south .who{color:var(--south)}
.ages{display:flex;flex:1;overflow-x:auto;background:var(--bg-elevated);border:1px solid var(--border);border-radius:99px;padding:4px}
.age{flex:1;text-align:center;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);padding:5px 6px;white-space:nowrap;border-radius:99px}
.age.on{color:var(--fg);background:var(--bg-subtle)}
.age.now.west{color:#1a1814;background:var(--you);font-weight:700}
.age.now.east{color:#1c100e;background:var(--them);font-weight:700}
.age.now.north{color:#101820;background:var(--north);font-weight:700}
.age.now.south{color:#12180e;background:var(--south);font-weight:700}
.race{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(14rem,100%),1fr));gap:8px;margin-bottom:12px}
.lane{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.lane .pair{display:flex;justify-content:space-between;gap:8px;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:6px}
.lane .pair b{color:var(--fg);font-weight:600;letter-spacing:0;text-transform:none;font-size:.78rem}
.dual{display:flex;flex-direction:column;gap:2px;border-radius:6px;overflow:hidden;background:#080c11;padding:3px}
.dual i{display:block;height:4px;border-radius:99px;min-width:0}
.dual i.w{background:var(--you)}
.dual i.e{background:var(--them)}
.dual i.n{background:var(--north)}
.dual i.s{background:var(--south)}
.stage{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;grid-template-areas:"log map city";gap:12px}
.stage > .panel:first-child{grid-area:log}
.stage > .map-panel{grid-area:map}
.stage > .panel.city{grid-area:city}
.panel{background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:0}
.kicker{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-subtle);font-weight:600;margin-bottom:8px}
.log{max-height:min(72vh,640px);overflow:auto;font-size:.82rem;line-height:1.4;color:var(--fg-muted)}
.log .ev{border-top:1px solid var(--border);padding:8px 0}
.log .ev b{display:block;color:var(--fg-subtle);font-size:.68rem;font-weight:600;letter-spacing:.06em}
.log .ev.jump{cursor:pointer;padding-left:10px}
.log .ev.jump:hover{color:var(--fg);background:color-mix(in oklab,var(--fg) 6%,transparent)}
.log .ev-raid{box-shadow:inset 3px 0 0 var(--danger)}
.log .ev-gold{box-shadow:inset 3px 0 0 #e8c040}
.log .ev-steal{box-shadow:inset 3px 0 0 #7ec8e0}
.log .ev-crown,.log .ev-king{box-shadow:inset 3px 0 0 #e8c040}
.log .ev-discover{box-shadow:inset 3px 0 0 #c8d0a8}
.log .ev-starve{box-shadow:inset 3px 0 0 #8a3a38}
.log .ev-age{box-shadow:inset 3px 0 0 #c4b090}
.log .ev-found{box-shadow:inset 3px 0 0 var(--you)}
.map-wrap{overflow:auto;background:#1a6a78;border-radius:10px;padding:8px;position:relative;touch-action:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:280px;max-height:min(72vh,640px);cursor:grab}
.map-wrap.grabbing{cursor:grabbing}
.map-zoom{position:absolute;top:10px;left:10px;z-index:3;display:flex;align-items:center;gap:4px;background:color-mix(in oklab,var(--bg-elevated) 88%,transparent);border:1px solid var(--border);border-radius:8px;padding:3px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.map-zoom .look{height:32px;min-width:28px;padding:0 8px;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}
.slip{position:absolute;top:10px;right:10px;z-index:4;max-width:min(240px,calc(100% - 88px));background:color-mix(in oklab,var(--bg-elevated) 92%,transparent);border:1px solid var(--border);border-radius:10px;padding:8px 10px;pointer-events:auto;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.slip[hidden]{display:none}
.slip .k{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-subtle);font-weight:700;margin:0 0 4px}
.slip .w{font-size:.82rem;line-height:1.3;color:var(--fg);margin:0}
.slip.age{box-shadow:inset 3px 0 0 #c4b090,0 8px 24px rgba(0,0,0,.35)}
.slip.crown,.slip.king{box-shadow:inset 3px 0 0 #e8c040,0 8px 24px rgba(0,0,0,.35)}
.slip.steal,.slip.discover{box-shadow:inset 3px 0 0 #8fd4ea,0 8px 24px rgba(0,0,0,.35)}
.slip.starve,.slip.vacant{box-shadow:inset 3px 0 0 var(--danger),0 8px 24px rgba(0,0,0,.35)}
.edict{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:6;width:min(420px,calc(100% - 24px));background:color-mix(in oklab,var(--bg-elevated) 94%,transparent);border:1px solid var(--border);border-radius:12px;padding:10px;pointer-events:auto;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.edict[hidden]{display:none}
.edict .k{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-subtle);font-weight:700;margin:0 0 4px}
.edict .w{font-size:.88rem;line-height:1.35;color:var(--fg);margin:0 0 8px;font-family:var(--font-display)}
.edict-choices{display:flex;flex-direction:column;gap:6px}
.edict-btn{height:auto;min-height:44px;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);display:flex;flex-direction:column;gap:2px}
.edict-btn b{font-size:.84rem;font-weight:650}
.edict-btn span{font-size:.72rem;color:var(--fg-muted);font-weight:500;line-height:1.3}
.edict-btn:hover{border-color:var(--accent);background:var(--bg-subtle)}
.map-zoom .btn{height:32px;min-width:32px;padding:0 9px}
.map-zoom .zlabel{font-family:var(--font-mono);font-size:.72rem;color:var(--fg-muted);min-width:2.8em;text-align:center}
.map-sizer{position:relative;margin:0 auto}
#map{display:grid;gap:0;width:max-content;margin:0 auto}

#iso{display:block;margin:0 auto;background:#2aa8b4;border-radius:4px}
#isoFx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.map-wrap.mode-iso #map{display:none}
.map-wrap.mode-grid #iso{display:none}
.map-wrap.mode-grid #isoFx{display:none}
.cell{width:18px;height:18px;background:#2a4a28;display:flex;align-items:center;justify-content:center;font-size:0;line-height:0;color:transparent;user-select:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cell.water{background:linear-gradient(180deg,#246a88 0%,#154a62 42%,#0e3a52 100%);box-shadow:inset 0 1px 0 #4a90a8, inset 0 -2px 0 #0a2838}
.cell.shore{background:linear-gradient(180deg,#4a7a62,#2a5a48);box-shadow:inset 0 1px 0 #6a9a78}
.cell.grass-d{background:repeating-linear-gradient(90deg,#1e3e22 0 3px,#234a28 3px 6px)}
.cell.grass{background:repeating-linear-gradient(-70deg,#2a522c 0 2px,#326434 2px 4px,#2f5a30 4px 7px)}
.cell.meadow{background:repeating-linear-gradient(80deg,#3a6a32 0 3px,#4a7a3c 3px 5px)}
.cell.wood{background:radial-gradient(circle at 40% 40%,#2a4a30 0 40%,#16301c 70%)}
.cell.tree{background:radial-gradient(circle at 50% 55%,#245a30 0 38%,#14301c 68%,#0c2014 100%);border-radius:42% 42% 28% 28%}
.cell.rock{background:linear-gradient(135deg,#5a6258,#3a423c 55%,#2a302c);box-shadow:inset 1px 1px 0 #7a8278}
.cell.yard.west{background:#5a4e3a}
.cell.yard.east{background:#5a3e36}
.cell.yard.north{background:#3e4e5a}
.cell.yard.south{background:#3e5a3a}
.cell.plaza.west{background:#8a7860}
.cell.plaza.east{background:#8a5a4c}
.cell.plaza.north{background:#6a7a8a}
.cell.plaza.south{background:#6a8a60}
.cell.field.west{background:#4a7a38}
.cell.field.east{background:#6a6a34}
.cell.field.north{background:#3a6a58}
.cell.field.south{background:#4a7a40}
.cell.crop-a{background:#5a8a3c}
.cell.crop-b{background:#3d6a30}
.cell.path{background:#5a4a34}
.cell.street{background:#3a342c}
.cell.haul{background:#8a7a40}
.cell.rail,.cell.street.rail,.cell.road.rail,.cell.path.rail,.cell.haul.rail{
  background:repeating-linear-gradient(90deg,#2a2824 0 3px,#8a8a94 3px 5px,#2a2824 5px 8px);
  box-shadow:inset 0 0 0 1px #1a1814;
}
.cell.civic{background:#4a5060}
.cell.civic.east{background:#5a4048}
.cell.civic.north{background:#3a5060}
.cell.civic.south{background:#3a5040}
.cell.works{background:#4a3c30}
.cell.house.west{background:#c4a06a}
.cell.house.east{background:#b47858}
.cell.house.north{background:#8aa4b8}
.cell.house.south{background:#8ab06a}
.cell.housing.west{background:#b89468}
.cell.housing.east{background:#a86a52}
.cell.housing.north{background:#7a98a8}
.cell.housing.south{background:#7aa060}
.cell.uni{background:#2e4a5c;color:#d8e8f0;font-weight:700;box-shadow:inset 0 0 0 1px #8ab0c4}
.cell.uni.west{background:#3a4a40}
.cell.uni.east{background:#4a3840}
.cell.uni.north{background:#2e4a5c}
.cell.uni.south{background:#2e4a34}
.cell.bar{background:#6a3a38;color:#f0d0a8;font-weight:700;box-shadow:inset 0 -3px 0 #c47840}
.cell.bar.west{background:#7a4a38}
.cell.bar.east{background:#7a3834}
.cell.bar.north{background:#5a3e48}
.cell.bar.south{background:#4a4a30}
.cell.military{background:#5a3c36}
.cell.military.west{background:#6a4c38}
.cell.military.east{background:#6a3c36}
.cell.military.north{background:#3a4450}
.cell.military.south{background:#3a4a30}
.cell.house.hungry{filter:saturate(.45) brightness(.72)}
.cell.house.fed{box-shadow:inset 0 -2px 0 #c4b060}
.cell.granary{background:#6a5430}
.cell.granary.full{background:#c4a050}
.cell.granary.low{background:#8a6a30}
.cell.granary.empty{background:#3a3020}
.cell.agent,.cell.king.west{
  background:radial-gradient(circle at 35% 30%, #fff3b0, #e2b000 55%, #8a6400);
  border-radius:50%;
  color:transparent;
  box-shadow:0 0 0 2px #5a4008, 0 0 10px #e8c040;
}
.cell.rival-agent,.cell.king.east{
  background:radial-gradient(circle at 35% 30%, #f6f8fb, #b8c2cc 55%, #5a6570);
  border-radius:50%;
  color:transparent;
  box-shadow:0 0 0 2px #2e3840, 0 0 10px #c8d2dc;
}
.cell.knight.west{
  background:#d4b060;
  border-radius:3px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #6a5010, 0 0 6px #c4a040;
}
.cell.knight.east{
  background:#9aa4ae;
  border-radius:3px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a4450, 0 0 6px #b0bac4;
}
.cell.vil.west{
  background:#c4b090;
  border-radius:50%;
  color:transparent;
  box-shadow:inset 0 0 0 2px #6a5840;
}
.cell.vil.east{
  background:#8a6a62;
  border-radius:50%;
  color:transparent;
  box-shadow:inset 0 0 0 2px #4a302c;
}
.cell.scribe.west{
  background:radial-gradient(circle at 30% 25%, #f7f1e2, #d4c4a0 58%, #7a6848);
  border-radius:2px 9px 2px 9px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #5a4a30, 0 0 6px #c8b890;
}
.cell.scribe.east{
  background:radial-gradient(circle at 30% 25%, #eef3f8, #a8b6c2 58%, #3e4c56);
  border-radius:2px 9px 2px 9px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2e3a42, 0 0 6px #b0bec8;
}
.cell.builder.west{
  background:#b08650;
  border-radius:2px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #5a3c18, 0 2px 0 #6a4a20;
}
.cell.builder.east{
  background:#8a6458;
  border-radius:2px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a241c, 0 2px 0 #4a3028;
}
.cell.king.north{
  background:radial-gradient(circle at 35% 30%, #e8f2fa, #7aa0c0 55%, #2a4050);
  border-radius:50%;
  color:transparent;
  box-shadow:0 0 0 2px #1e303c, 0 0 10px #8ab4d0;
}
.cell.king.south{
  background:radial-gradient(circle at 35% 30%, #e8f4d8, #7a9a62 55%, #2a4018);
  border-radius:50%;
  color:transparent;
  box-shadow:0 0 0 2px #243818, 0 0 10px #8ab060;
}
.cell.king.true-crown{
  box-shadow:0 0 0 3px #d4a018, 0 0 16px #f0d060;
}
.cell.knight.north{
  background:#7a98ac;
  border-radius:3px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2a4050, 0 0 6px #8ab0c4;
}
.cell.knight.south{
  background:#7a9a58;
  border-radius:3px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a5020, 0 0 6px #8ab060;
}
.cell.vil.north{
  background:#8aa0b0;
  border-radius:50%;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a4c58;
}
.cell.vil.south{
  background:#8aa072;
  border-radius:50%;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a4c28;
}
.cell.scribe.north{
  background:radial-gradient(circle at 30% 25%, #eef4f8, #a0b8c8 58%, #3a5060);
  border-radius:2px 9px 2px 9px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2e4048, 0 0 6px #b0c8d4;
}
.cell.scribe.south{
  background:radial-gradient(circle at 30% 25%, #eef6e4, #a8c090 58%, #3a5028);
  border-radius:2px 9px 2px 9px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2e4020, 0 0 6px #b0c898;
}
.cell.builder.north{
  background:#6a8494;
  border-radius:2px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2a3840, 0 2px 0 #3a4850;
}
.cell.builder.south{
  background:#6a8450;
  border-radius:2px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2a3818, 0 2px 0 #3a4820;
}
.cell.crew.west{
  background:#6a6258;
  border-radius:1px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a342c, 0 0 5px #8a8070;
}
.cell.crew.east{
  background:#6a524c;
  border-radius:1px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #3a2c28, 0 0 5px #8a7068;
}
.cell.crew.north{
  background:#4a5a66;
  border-radius:1px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2a3840, 0 0 5px #708898;
}
.cell.crew.south{
  background:#4a5a38;
  border-radius:1px;
  color:transparent;
  box-shadow:inset 0 0 0 2px #2a3818, 0 0 5px #708850;
}
.cell.train{
  background:linear-gradient(90deg,#3a3a42,#c4c4cc 40%,#2a2a30);
  border-radius:3px;
  color:#1a1814;
  font-weight:700;
  box-shadow:0 0 0 1px #111, 0 0 8px #c8c0a0;
}
.cell.train.west{box-shadow:0 0 0 1px #5a4008, 0 0 8px #e8c040}
.cell.train.east{box-shadow:0 0 0 1px #5a3028, 0 0 8px #c47a62}
.cell.train.north{box-shadow:0 0 0 1px #2a4050, 0 0 8px #7aa0c0}
.cell.train.south{box-shadow:0 0 0 1px #2a4018, 0 0 8px #7a9a62}
.cell.mill{background:#5a4a38}
.cell.mill.west{background:#6a5a40}
.cell.mill.east{background:#6a4a38}
.cell.mill.north{background:#4a5a60}
.cell.mill.south{background:#4a5a38}
.cell.mill.live{box-shadow:0 0 10px #c8a050, inset 0 0 0 1px #e8d080}
.cell.mill.dry{filter:saturate(.4) brightness(.7)}
.cell.warehouse{background:#4a4034}
.cell.warehouse.west{background:#5a4a30}
.cell.warehouse.east{background:#5a3a30}
.cell.warehouse.north{background:#3a4a50}
.cell.warehouse.south{background:#3a4a28}
.cell.wonder{
  background:linear-gradient(180deg,#e8d090,#8a7030);
  color:#2a2008;
  font-weight:800;
  box-shadow:0 0 0 1px #5a4010, 0 0 12px #d4b060;
}
.cell.wonder.west{background:linear-gradient(180deg,#f0d878,#8a6810)}
.cell.wonder.east{background:linear-gradient(180deg,#e0b0a0,#8a5040)}
.cell.wonder.north{background:linear-gradient(180deg,#c0d0e0,#4a6070)}
.cell.wonder.south{background:linear-gradient(180deg,#c8d090,#4a6030)}
.cell.airport{background:#3a3a42;color:#d8d8e0;font-weight:700}
.cell.airport.west{background:#4a4030}
.cell.airport.east{background:#4a3030}
.cell.airport.north{background:#303848}
.cell.airport.south{background:#304030}
.cell.runway{
  background:repeating-linear-gradient(90deg,#2a2a30 0 6px,#d8d8c8 6px 8px,#2a2a30 8px 14px);
}
.cell.plane{
  background:#e8e8f0;
  color:#101018;

function paintLand(w,h,set){
  const kind=Array.from({length:h},()=>Array(w).fill("grass"));
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const e=elev(x,y);

    const grove=n01((x+5)>>2,(y+2)>>2);

    else if(e<0.60) k="grass";
    else if(e<0.76) k="meadow";

    if(k!=="water" && k!=="shore" && grove>0.50 && e>0.42 && e<0.80) k=(n01(x,y+3)>0.32)?"tree":"wood";
    if((k==="grass"||k==="grass-d") && patch>0.52 && patch<0.68 && e>0.40) k="meadow";

  }
  let ry=6+(hash(2,9)%10);
  for(let x=0;x<w;x++){

    if(step===0 && ry>3) ry--;
    else if(step===1 && ry<h-4) ry++;
  }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(kind[y][x]!=="water"){
      let adj=0;
      if(x&&kind[y][x-1]==="water") adj++;
      if(x<w-1&&kind[y][x+1]==="water") adj++;
      if(y&&kind[y-1][x]==="water") adj++;
      if(y<h-1&&kind[y+1][x]==="water") adj++;
      if(adj>=1 && (kind[y][x]==="grass"||kind[y][x]==="grass-d"||kind[y][x]==="meadow")) kind[y][x]="shore";
    }
  }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(kind[y][x]==="water"){
      let land=0;
      if(x&&kind[y][x-1]!=="water") land++;
      if(x<w-1&&kind[y][x+1]!=="water") land++;
      if(y&&kind[y-1][x]!=="water") land++;
      if(y<h-1&&kind[y+1][x]!=="water") land++;

function faceClass(kind,id,x,y){

function paintHarbour(set,occ,w,h,world){
  const mills=(world.structures||[]).filter(s=>s.type==="mill");
  const dirs=[[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0],[0,2],[0,-2],[1,1],[-1,1],[1,-1],[-1,-1]];
  function isWater(x,y){
    if(x<0||y<0||x>=w||y>=h) return false;
    const c=occ[x+","+y];
    return c && (c.cls==="water" || (c.cls||"").indexOf("boat")>=0);
  }
  function isLand(x,y){
    if(x<0||y<0||x>=w||y>=h) return false;
    const c=occ[x+","+y];
    return c && c.cls!=="water";
  }
  for(const mill of mills){
    const fn=facName(factionOf(world,mill));
    let wx=null,wy=null,bd=99;
    for(let dy=-5;dy<=5;dy++) for(let dx=-5;dx<=5;dx++){
      const x=mill.x+dx, y=mill.y+dy;
      if(!isWater(x,y)) continue;
      const d=Math.abs(dx)+Math.abs(dy);
      if(d<bd){bd=d;wx=x;wy=y;}
    }
    if(wx==null) continue;
    let x=mill.x, y=mill.y;
    while(x!==wx||y!==wy){
      if(x!==wx) x+=wx>x?1:-1;
      else if(y!==wy) y+=wy>y?1:-1;
      const cell=occ[x+","+y];

      if(cell.z>=6) continue;
      if(cell.cls==="water") set(x,y,"quay","",fn+" harbour",4);

      const cell=occ[bx+","+by];
      if(cell&&cell.z>=6) continue;
      set(bx,by,"boat","",fn+" boat",5);
      boats++;
    }
  }
}

function isoKind(cls){
  const c=cls||"";
  if(c.indexOf("water")>=0 && c.indexOf("boat")<0) return "water";
  if(c.indexOf("shore")>=0) return "shore";
  if(c.indexOf("crop")>=0||c.indexOf("field")>=0) return "field";
  if(c.indexOf("rail")>=0) return "rail";
  if(c.indexOf("street")>=0||c.indexOf("path")>=0||c.indexOf("haul")>=0) return "road";
  if(c.indexOf("tree")>=0) return "tree";
  if(c.indexOf("wood")>=0) return "wood";
  if(c.indexOf("rock")>=0) return "rock";
  if(c.indexOf("meadow")>=0) return "meadow";
  if(c.indexOf("grass")>=0) return "grass";
  if(c.indexOf("yard")>=0) return "grass";
  if(c.indexOf("race")>=0) return "water";
  if(c.indexOf("king")>=0||c.indexOf("knight")>=0||c.indexOf("scribe")>=0||c.indexOf("builder")>=0||c.indexOf("crew")>=0||c.indexOf("vil")>=0) return "walker";
  if(c.indexOf("train")>=0||c.indexOf("taxi")>=0||c.indexOf("bus")>=0||c.indexOf("plane")>=0) return "vehicle";
  return "built";
}
function isoH(cls,x,y){
  const c=cls||"";
  const e=elev(x||0,y||0);
  const k=isoKind(c);
  if(k==="water") return 1;
  if(k==="shore") return 3;
  if(k==="road") return 4;
  if(k==="rail") return 5;
  if(k==="field") return 4;
  if(k==="grass") return 5+Math.round(e*16);
  if(k==="meadow") return 6+Math.round(e*14);
  if(k==="wood") return 7+Math.round(e*10);
  if(k==="tree") return 8+Math.round(e*8);
  if(k==="rock") return 9+Math.round(e*12);
  if(c.indexOf("boat")>=0) return 8;
  if(c.indexOf("foundry")>=0) return 16;
  if(c.indexOf("mill")>=0) return 18;
  if(c.indexOf("hall")>=0||c.indexOf("settlement")>=0) return 16;
  if(c.indexOf("wonder")>=0||c.indexOf("peak")>=0) return 28;
  if(c.indexOf("temple")>=0) return 14;
  if(c.indexOf("uni")>=0||c.indexOf("warehouse")>=0) return 14;
  if(c.indexOf("tower")>=0||c.indexOf("hotel")>=0||c.indexOf("highrise")>=0) return 32;
  if(c.indexOf("manor")>=0) return 16;
  if(c.indexOf("house")>=0||c.indexOf("housing")>=0){
    if(c.indexOf("row")>=0) return 13;
    if(c.indexOf("cot")>=0) return 10;
    return 8;
  }
  if(c.indexOf("king")>=0||c.indexOf("knight")>=0) return 12;
  if(c.indexOf("vil")>=0||c.indexOf("scribe")>=0||c.indexOf("builder")>=0||c.indexOf("crew")>=0) return 9;
  if(c.indexOf("train")>=0||c.indexOf("bus")>=0) return 8;
  if(c.indexOf("taxi")>=0||c.indexOf("plane")>=0) return 7;
  if(c.indexOf("quay")>=0) return 5;
  return 6;
}

  ctx.lineTo(b.sx-tw, b.sy-h);
  ctx.closePath();
  ctx.fillStyle=top;
  ctx.fill();
  if(h<=1) return;
  ctx.beginPath();
  ctx.moveTo(b.sx-tw, b.sy-h);
  ctx.lineTo(b.sx, b.sy+th-h);
  ctx.lineTo(b.sx, b.sy+th);
  ctx.lineTo(b.sx-tw, b.sy);
  ctx.closePath();
  ctx.fillStyle=left;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(b.sx+tw, b.sy-h);
  ctx.lineTo(b.sx, b.sy+th-h);
  ctx.lineTo(b.sx, b.sy+th);

  ctx.fillStyle=right;

function isoRoadAt(occ,x,y){

function isoAnchor(occ,x,y,tag){

function drawIsoRoof(ctx,b,wall,rh,light,dark){

function drawIsoWalker(ctx,x,y,ox,oy,cls,now,moving){
  const b=isoScreen(x,y,ox,oy);
  const t=now||0;
  const step=Math.sin(t*0.008+(x*9+y*5));
  const bob=moving?Math.abs(step)*1.7:0.4;
  const swing=moving?step*2.4:0;
  isoContact(ctx,b.sx,b.sy+1,6.4,2.5);
  const c=cls||"";
  let shirt="#d8d2c6", pants="#4a4038", skin="#e8c8a8";
  if(c.indexOf("east")>=0) shirt="#c47a62";
  else if(c.indexOf("north")>=0) shirt="#7aa0c0";
  else if(c.indexOf("south")>=0) shirt="#7a9a62";
  if(c.indexOf("builder")>=0) shirt="#c4a060";
  if(c.indexOf("scribe")>=0) shirt="#8ab0c4";
  if(c.indexOf("crew")>=0) shirt="#6a6058";
  if(c.indexOf("knight")>=0){ shirt="#8a9098"; pants="#3a4048"; }
  if(c.indexOf("king")>=0){ shirt="#e8d080"; pants="#5a3a18"; }
  if(c.indexOf("hungry")>=0){ shirt="#6a6864"; pants="#3a3834"; skin="#c4b098"; }
  const cx=b.sx, cy=b.sy-3-bob;
  ctx.fillStyle=pants;
  ctx.fillRect(cx-3-swing, cy, 2, 6);
  ctx.fillRect(cx+1+swing, cy, 2, 6);
  ctx.fillStyle=shirt;
  ctx.fillRect(cx-4, cy-9, 8, 9);
  ctx.fillStyle=skin;
  ctx.beginPath();
  ctx.arc(cx, cy-12, 3.2, 0, 6.28);
  ctx.fill();
  if(c.indexOf("true-crown")>=0){
    ctx.fillStyle="#f0d060";
    ctx.fillRect(cx-4, cy-17, 8, 3);
    ctx.fillRect(cx-1, cy-20, 2, 3);
    ctx.fillStyle="#e8c040";
    ctx.fillRect(cx-0.5, cy-21, 1, 1);
  } else if(c.indexOf("king")>=0){
    ctx.fillStyle="#f0d060";
    ctx.fillRect(cx-3, cy-16, 6, 2);
  }
  if(c.indexOf("knight")>=0){
    ctx.fillStyle="#6a7078";
    ctx.fillRect(cx-3, cy-15, 6, 3);
  }
}
function drawIsoRail(ctx,x,y,ox,oy,occ){
  drawIsoBox(ctx,x,y,4,["#6a6458","#3a3630","#1a1814"],ox,oy);
  const b=isoScreen(x,y,ox,oy);
  const alongX=isoRailAt(occ,x-1,y)||isoRailAt(occ,x+1,y);
  const alongY=isoRailAt(occ,x,y-1)||isoRailAt(occ,x,y+1);
  const dirs=[];
  if(alongX) dirs.push({dx:ISO_TW/2, dy:ISO_TH/2});
  if(alongY) dirs.push({dx:-ISO_TW/2, dy:ISO_TH/2});
  if(!dirs.length) dirs.push({dx:ISO_TW/2, dy:ISO_TH/2});
  ctx.save();
  ctx.lineCap="butt";
  ctx.lineJoin="round";
  for(let i=0;i<dirs.length;i++){
    const d=dirs[i];
    const px=-d.dy*0.18, py=d.dx*0.18;
    ctx.strokeStyle="#4a3420";
    ctx.lineWidth=2.2;
    for(let s=-2;s<=2;s++){
      const t=s/2.4;
      ctx.beginPath();
      ctx.moveTo(b.sx+d.dx*t-px*1.1, b.sy+d.dy*t-py*1.1);
      ctx.lineTo(b.sx+d.dx*t+px*1.1, b.sy+d.dy*t+py*1.1);
      ctx.stroke();
    }
    ctx.strokeStyle="#c8c8d2";
    ctx.lineWidth=1.35;
    ctx.beginPath();
    ctx.moveTo(b.sx-d.dx*0.55+px, b.sy-d.dy*0.55+py);
    ctx.lineTo(b.sx+d.dx*0.55+px, b.sy+d.dy*0.55+py);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(b.sx-d.dx*0.55-px, b.sy-d.dy*0.55-py);
    ctx.lineTo(b.sx+d.dx*0.55-px, b.sy+d.dy*0.55-py);
    ctx.stroke();
  }
  ctx.restore();
}

    ctx.moveTo(b.sx+8, b.sy-1);

}

function drawIsoSprite(ctx,x,y,ox,oy,kind,face,air,jam){
  const b=isoScreen(x,y,ox,oy);
  const lift=kind==="plane"?(air?28:3):(kind==="train"?1.4:(kind==="bus"?2:1.6));
  const side=jam?((kind==="taxi"||kind==="bus")?0.18:0):0;
  const oxs=(face==="n"||face==="s")?side*ISO_TW:0;
  const oys=side?2:0;
  isoContact(ctx, b.sx+oxs, b.sy+oys+(air&&kind==="plane"?4:1), kind==="plane"?11:(kind==="train"?10:7), kind==="plane"?4:2.6);
  const img=SPRITES[kind];
  if(img&&img.complete&&img.naturalWidth){
    ctx.save();
    ctx.translate(b.sx+oxs, b.sy-lift+oys);
    if(face==="w") ctx.scale(-1,1);
    else if(face==="n") ctx.rotate(-0.55);
    else if(face==="s") ctx.rotate(0.55);
    const s=kind==="plane"?30:(kind==="bus"?26:(kind==="train"?30:20));
    ctx.drawImage(img, -s/2, -s+6, s, s);
    ctx.restore();
    return;
  }
  let body="#b09060";
  if(kind==="taxi") body="#d8c050";
  if(kind==="bus") body="#6a8aaa";
  if(kind==="plane") body="#d0d4d8";
  if(kind==="train") body="#8a5a38";
  ctx.fillStyle=body;
  ctx.beginPath();
  ctx.moveTo(b.sx-10+oxs, b.sy-lift+oys);
  ctx.lineTo(b.sx+10+oxs, b.sy-lift-4+oys);
  ctx.lineTo(b.sx+10+oxs, b.sy-lift-10+oys);
  ctx.lineTo(b.sx-10+oxs, b.sy-lift-6+oys);
  ctx.closePath();
  ctx.fill();
}

function drawIso(occ,w,h){
  const canvas=$("iso");
  if(!canvas||!canvas.getContext) return;
  const orig=isoOrigin(w,h);
  orig.oy=58;
  const width=Math.ceil(orig.ox+(w)*(ISO_TW/2)+24);
  const height=Math.ceil(orig.oy+(w+h)*(ISO_TH/2)+88);
  if(canvas.width!==width) canvas.width=width;
  if(canvas.height!==height) canvas.height=height;
  const ctx=canvas.getContext("2d");
  const sea=ctx.createLinearGradient(0,0,0,height);
  sea.addColorStop(0,"#d4e8f0");
  sea.addColorStop(0.08,"#b4dce4");
  sea.addColorStop(0.16,"#5ecad4");
  sea.addColorStop(0.45,"#2eb0bc");
  sea.addColorStop(1,"#1a7a88");
  ctx.fillStyle=sea;
  ctx.fillRect(0,0,width,height);
  const keys=[];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) keys.push(x+","+y);
  keys.sort(function(a,b){
    const ap=a.split(","), bp=b.split(",");
    const ax=+ap[0], ay=+ap[1], bx=+bp[0], by=+bp[1];
    return (ax+ay)-(bx+by) || ax-bx;
  });
  function pass(pred){
    for(let i=0;i<keys.length;i++){
      const parts=keys[i].split(",");
      const x=+parts[0], y=+parts[1];
      const cell=occ[keys[i]]||{cls:"grass"};
      const cls=cell.cls||"grass";
      if(!pred(cls)) continue;
      if(isoKind(cls)==="tree"){ drawIsoTree(ctx,x,y,orig.ox,orig.oy); continue; }
      if(isoKind(cls)==="wood"){ drawIsoBush(ctx,x,y,orig.ox,orig.oy); continue; }
      if(isoKind(cls)==="water"){ drawIsoWater(ctx,x,y,orig.ox,orig.oy,cls); continue; }
      if(isoKind(cls)==="shore"){ drawIsoShore(ctx,x,y,orig.ox,orig.oy); continue; }
      if(isoKind(cls)==="rail"){ drawIsoRail(ctx,x,y,orig.ox,orig.oy,occ); continue; }
      if(isoKind(cls)==="road"){ drawIsoStreet(ctx,x,y,orig.ox,orig.oy,occ); continue; }
      if(isoKind(cls)==="built"){ drawIsoBuilt(ctx,occ,x,y,orig.ox,orig.oy,cls); continue; }
      if(isoKind(cls)==="walker") continue;
      if(isoKind(cls)==="vehicle") continue;
      drawIsoBox(ctx,x,y,isoH(cls,x,y),isoFill(cls,x,y),orig.ox,orig.oy);
    }
  }
  pass(function(c){ const k=isoKind(c); return k==="water"; });
  pass(function(c){ const k=isoKind(c); return k==="shore"; });
  pass(function(c){ const k=isoKind(c); return k!=="water"&&k!=="shore"&&k!=="built"&&k!=="walker"&&k!=="vehicle"; });
  pass(function(c){ return isoKind(c)==="built"; });
  pass(function(c){ return isoKind(c)==="walker"; });
  window.__isoOcc=occ;
  window.__isoWH=[w,h];
  window.__isoOrig=orig;
  const fx=$("isoFx");
  if(fx&&(fx.width!==canvas.width||fx.height!==canvas.height)){
    fx.width=canvas.width;
    fx.height=canvas.height;
  }
}

function renderMap(world){
  if(!world) return;
  const w=world.width||48,h=world.height||48;
  const occ={};
  function set(x,y,cls,mark,title,z){
    if(x<0||y<0||x>=w||y>=h) return;
    const k=x+","+y;
    if(!occ[k]||occ[k].z<=z) occ[k]={cls,mark:mark||"",title:title||"",z};
  }
  paintLand(w,h,set);
  function wet(x,y){
    const c=occ[x+","+y];
    return !c || c.cls==="water";
  }
  const towns=world.settlements||[];
  const townDays={};
  for(const town of towns) townDays[town.id]=foodDays(town);
  for(const town of towns){
    const era=Number(town.era||2);
    const pop=Number(town.population||0);
    const r=Math.min(5, 2+(era>=5?2:era>=4?1:0));
    const fn=facName(town.faction);
    const days=townDays[town.id];
    const hungry=days!=null&&days<1;
    const fed=days!=null&&days>=3;
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.abs(dx)+Math.abs(dy)>r) continue;
      const tx=town.x+dx, ty=town.y+dy;
      if(wet(tx,ty)) continue;
      const ring=Math.abs(dx)+Math.abs(dy);
      const street=(dx===0||dy===0)&&!(dx===0&&dy===0);
      let cls;
      if(street) cls="street";
      else if(ring<=2) cls="plaza "+fn;
      else continue;
      const z=street?2:3;
      set(tx,ty,cls,"",town.id+(street?" street":" square"),z);
    }
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(!wet(town.x+dx,town.y+dy)) set(town.x+dx,town.y+dy,"plaza "+fn,"",town.id+" square",4);
    }
    if(era<4){
      const tents=Math.min(20, Math.floor(Number(town.soldiers||0)/7));
      if(tents){
        const camps=(world.structures||[]).filter(s=>s.type==="barracks"&&factionOf(world,s)===(town.faction||"player"));
        const bx=camps[0]?camps[0].x:town.x+2, by=camps[0]?camps[0].y:town.y-2;
        for(let i=0;i<tents;i++){
          const hx=bx+(i%5)-2, hy=by+Math.floor(i/5)-1;
          const cell=occ[hx+","+hy];
          if(cell && (cell.cls==="water"||cell.z>=6)) continue;
          set(hx,hy,"camp "+fn,"",fn+" camp",5);
        }
      }
    }
  }
  const CIVIC={academy:1,library:1,lab:1,observatory:1,temple:1,hall:1,market:1,wonder:1};
  const WORKS={workshop:1,foundry:1,mine:1,mill:1,warehouse:1};
  for(const st of world.structures||[]){
    const fn=facName(factionOf(world,st));
    if(st.type==="farm"||st.type==="irrigation"){
      const R=st.type==="irrigation"?3:2;
      for(let dy=-R;dy<=R;dy++) for(let dx=-R;dx<=R;dx++){
        if(wet(st.x+dx,st.y+dy)) continue;
        const crop=(st.y+dy)%2===0?"crop-a":"crop-b";
        set(st.x+dx,st.y+dy,crop+" field "+fn,"","fields",3);
      }
    }
    if(CIVIC[st.type]){
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        if(wet(st.x+dx,st.y+dy)) continue;
        const cell=occ[(st.x+dx)+","+(st.y+dy)];
        if(cell&&cell.z>=4) continue;
        set(st.x+dx,st.y+dy,"civic "+fn,"","civic",3);
      }
    }
    if(WORKS[st.type]){
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        if(wet(st.x+dx,st.y+dy)) continue;
        const cell=occ[(st.x+dx)+","+(st.y+dy)];

function chronicleDiff(world){
  if(!prevWorld){prevWorld=world;return;}
  const tick=world.tick, oldBy={};
  for(const s of prevWorld.settlements||[]) oldBy[s.id]=s;
  for(const s of world.settlements||[]){
    const o=oldBy[s.id];
    const who=whoOf(s.faction);
    if(!o){logLine(tick,`${who} founded ${s.id}.`,{x:s.x,y:s.y,fac:s.faction,kind:"found"});continue;}
    if(Number(s.era||2)>Number(o.era||2)) logLine(tick,`${who} ${s.id} became a ${ERA_WORD[s.era]||("era "+s.era)}.`,{x:s.x,y:s.y,fac:s.faction,kind:"age"});
    const had=new Set(o.subjects||[]);
    for(const sub of (s.subjects||[])) if(sub&&!had.has(sub)) logLine(tick,`${who} ${s.id} unlocked ${sub}.`);
    if(Number(s.discoveries||0)>Number(o.discoveries||0)) logLine(tick,`${who} ${s.id} made a discovery (${s.discoveries}).`,{x:s.x,y:s.y,fac:s.faction,kind:"discover"});
  }
  const risen={library:"A library rose",lab:"A lab rose",observatory:"An observatory rose",barracks:"Barracks rose",academy:"A university rose",farm:"Fields spread",mill:"A mill rose",foundry:"A foundry smoked",warehouse:"A warehouse rose",wonder:"A pyramid rose from the dirt",temple:"A temple was found",airport:"An airport rose",market:"A bar opened on the street"};
  for(const [typ,line] of Object.entries(risen)){
    const n=(wld,fac)=>ownStructs(wld,fac).filter(s=>s.type===typ).length;
    if(n(world,"player")>n(prevWorld,"player")) logLine(tick,`${line} in the west.`);
    if(n(world,"rival")>n(prevWorld,"rival")) logLine(tick,`${line} in the east.`);
    if(n(world,"north")>n(prevWorld,"north")) logLine(tick,`${line} in the north.`);
    if(n(world,"south")>n(prevWorld,"south")) logLine(tick,`${line} in the south.`);
  }
  prevWorld=world;
}
function raceLine(world){
  if(!world) return "";
  const s=sidesOf(world);
  const poles=POLES.map(([fac])=>s[fac]);
  if(poles.every(p=>!p.cap)) return "All still walking.";
  const hungry=poles.filter(p=>{
    const d=p.cap?foodDays(p.cap):null;
    return d!=null&&d<1;
  });
  if(hungry.length){
    const names=hungry.map(p=>p.label).join(" · ");
    const late=hungry.some(p=>p.era>=6);
    return late?`${names} hungry under a skyline. Food still kills.`:`${names} short of food. The granary is empty.`;
  }
  const sciLead=[...poles].sort((a,b)=>b.sci.steps-a.sci.steps);
  if(sciLead[0].sci.steps>sciLead[1].sci.steps) return `${sciLead[0].label} leads the science path (${sciLead[0].sci.steps} vs ${sciLead[1].sci.steps}).`;
  const ageLead=[...poles].sort((a,b)=>orderOf(b.now)-orderOf(a.now));
  if(orderOf(ageLead[0].now)>orderOf(ageLead[1].now)) return `${ageLead[0].label} leads the ages — ${AGES.find(a=>a[0]===ageLead[0].now)[1]}.`;
  const popLead=[...poles].sort((a,b)=>b.people-a.people);
  if(popLead[0].people>popLead[1].people) return `Even on the path. ${popLead[0].label} has more people (${popLead[0].people}).`;
  return `Even — four poles on the same island.`;
}
function holdTitle(winner){
  if(winner==="player") return "The west holds";
  if(winner==="rival") return "The east holds";
  if(winner==="north") return "The north holds";
  if(winner==="south") return "The south holds";
  return "Even";
}

function renderBanner(state){

  if(state.status==="done"){
    const w=o.winner||"";
    banner.className="banner "+(w&&w!=="draw"?"win":(w==="draw"?"":""));
    banner.textContent=w?`${holdTitle(w)} · ${o.kind||"outcome"}. Clock ended.`:(`Finished · Score ${state.score??"—"}.`);
  } else if(state.status==="error"){banner.className="banner lose";banner.textContent="Could not run. Hit Watch again.";$("begin").disabled=false;}
  else if(state.status==="decision"){banner.className="banner win";banner.textContent=(state.decision&&state.decision.prompt)||"The west looks to you.";}
  else if(o.winner){banner.className="banner "+(o.winner!=="draw"?"win":"");banner.textContent=`${holdTitle(o.winner)} · ${o.kind||"outcome"}. The ages continue.`;}
  else if(state.paused){banner.className="banner";banner.textContent="Paused. "+raceLine(state.world);}

  else {banner.className="banner";banner.textContent="Open a world. You govern the west when it asks. · v60";}
  renderEpilogue(state);
}

function applyZoom(){
  const sizer=$("mapSizer"), lab=$("zoomLabel"), iso=$("iso");
  if(!sizer||!iso) return;
  const w=iso.width||1200, h=iso.height||700;
  const nw=Math.max(1,Math.round(w*zoom))+"px";
  const nh=Math.max(1,Math.round(h*zoom))+"px";
  if(sizer.style.width!==nw) sizer.style.width=nw;
  if(sizer.style.height!==nh) sizer.style.height=nh;
  if(iso.style.width!=="100%") iso.style.width="100%";
  if(iso.style.height!=="100%") iso.style.height="100%";
  if(lab) lab.textContent=(zoom<1?(Math.round(zoom*100)/100): (Math.round(zoom*10)/10))+"×";
  markLook();
}
function markLook(){
  document.querySelectorAll("[data-look]").forEach(b=>b.classList.toggle("on", b.dataset.look===lookAt));

function parkCamera(world){

  wrap.scrollTop=Math.max(0, p.sy*zoom - wrap.clientHeight*0.40);
}
function lookPole(name){

function zoomMin(){ return 0.12; }
function fitMap(){

}
function setZoom(z, focus){
  const wrap=$("mapWrap");

  const old=zoom;
  zoom=Math.round(Math.min(4, Math.max(zmin, Number(z)||zmin))*1000)/1000;
  const sl=wrap?wrap.scrollLeft:0, st=wrap?wrap.scrollTop:0;

    const r=zoom/old;
    wrap.scrollLeft=Math.max(0, (sl+focus.x)*r - focus.x);

  }

(function(){
